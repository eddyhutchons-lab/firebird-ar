<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Firebird AR — interactive mural</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-cache">
<!-- Suppresses the browser's automatic /favicon.ico request, which otherwise
     logs a 404 on every load and sends people hunting for a missing file. -->
<link rel="icon" href="data:,">

<!-- Vendored so a live site has no CDN dependency. CDN equivalents if ever needed:
     https://aframe.io/releases/1.5.0/aframe.min.js
     https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js -->
<script src="./vendor/aframe.min.js"></script>
<script src="./vendor/mindar-image-aframe.prod.js"></script>

<style>
/* MindAR injects its <video> into <body> at z-index:-2 — the ROOT stacking
   context — so an opaque background on <body> paints straight over the camera
   feed and you get a black screen. The letterbox colour lives on <html>;
   <body> stays transparent. This is not cosmetic, it is the bug. */
html { background:#000; height:100%; margin:0; }
body {
  margin:0; height:100%; overflow:hidden; background:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent; color:var(--ink);
}
body > video { z-index:0 !important; }
a-scene { position:fixed; inset:0; z-index:1; }

:root{
  --ground:#0c0b0d; --ink:#f6f0e0; --accent:#ecbe48; --ball:#eb6e18; --pop:#ffd447;
}
.sheet{
  position:fixed; inset:0; z-index:4; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
  padding:28px 22px; background:var(--ground); gap:14px;
}
.sheet.hide{ display:none; }
.kicker{ font-size:12px; letter-spacing:.22em; color:var(--accent); font-weight:700; }
h1{ font-size:clamp(30px,9vw,46px); line-height:1.04; margin:0; font-weight:800; }
h1 span{ color:var(--accent); display:block; }
p.intro{ max-width:30ch; font-size:15px; line-height:1.5; opacity:.82; margin:0; }
button{
  font:inherit; font-weight:700; font-size:17px; border:0; border-radius:999px;
  padding:16px 34px; background:var(--accent); color:#17120a; cursor:pointer;
}
button.ghost{ background:transparent; color:var(--ink); border:1.5px solid rgba(246,240,224,.35); }
input{
  font:inherit; font-size:17px; text-align:center; padding:13px 18px; border-radius:12px;
  border:1.5px solid rgba(246,240,224,.3); background:rgba(0,0,0,.35); color:var(--ink);
  width:min(260px,70vw);
}
small#build{ position:fixed; bottom:14px; left:0; right:0; font-size:11px; opacity:.5; }
#warn{
  display:none; position:fixed; top:0; left:0; right:0; z-index:6; padding:11px 16px;
  background:#8a4a10; color:#fff; font-size:13px; line-height:1.4;
}
#warn.on{ display:block; }

/* ---------------------------------------------------------------- in-play UI */
#hud{
  position:fixed; inset:0; z-index:3; pointer-events:none; display:none;
  flex-direction:column; justify-content:space-between; padding:18px;
}
#hud.on{ display:flex; }
.hudrow{ display:flex; align-items:center; justify-content:space-between; }
#score{
  font-size:34px; font-weight:800; color:var(--ink);
  text-shadow:0 2px 14px rgba(0,0,0,.85);
}
#misses{ display:flex; gap:7px; }
#misses i{
  width:11px; height:11px; border-radius:50%; background:rgba(246,240,224,.3);
  border:1.5px solid rgba(246,240,224,.55); display:block;
}
#misses i.spent{ background:#d8382e; border-color:#d8382e; }
#say{
  align-self:center; font-size:19px; font-weight:800; letter-spacing:.05em;
  color:var(--pop); text-shadow:0 2px 16px rgba(0,0,0,.9); opacity:0;
  transition:opacity .18s; text-align:center;
}
#say.on{ opacity:1; }
#hint{
  align-self:center; font-size:13px; opacity:.85; color:var(--ink);
  text-shadow:0 2px 10px rgba(0,0,0,.9); text-align:center;
}
#nums{ display:flex; flex-wrap:wrap; gap:9px; justify-content:center; margin:4px 0 2px; }
#nums b{
  min-width:46px; padding:11px 6px; border-radius:50%; background:#f8f4e8; color:#14110f;
  font-size:19px; font-weight:800; border:3px solid var(--accent);
}
</style>
</head>
<body>

<div id="warn"></div>

<!-- passcode gate -->
<div id="lock" class="sheet hide">
  <div class="kicker">FIREBIRD AFRICA</div>
  <h1 id="lockTitle">Work in progress</h1>
  <p class="intro" id="lockBody"></p>
  <input id="code" type="text" autocapitalize="none" autocomplete="off" placeholder="passcode">
  <div id="codeErr" style="visibility:hidden;font-size:13px;color:#ff9a8a">Not that one. Try again.</div>
  <button id="unlock">Enter</button>
</div>

<!-- start screen -->
<div id="gate" class="sheet hide">
  <div class="kicker" id="kicker">FIREBIRD AFRICA · AR SITE</div>
  <h1 id="title">Lottery<span id="titleAccent">Jackpot</span></h1>
  <p class="intro" id="intro"></p>
  <button id="start">Start camera</button>
  <small id="build"></small>
</div>

<!-- heads-up display while playing -->
<div id="hud">
  <div class="hudrow">
    <div id="score">0</div>
    <div id="misses"></div>
  </div>
  <div id="say"></div>
  <div id="hint">Point at the wall</div>
</div>

<!-- result card -->
<div id="over" class="sheet hide">
  <div class="kicker" id="overLabel">FOR THE NEXT DRAW</div>
  <h1 id="overTitle">Your six numbers</h1>
  <div id="nums"></div>
  <p class="intro" id="overBody"></p>
  <button id="again">Play again</button>
  <button id="share" class="ghost">Share your numbers</button>
  <button id="overCta" class="ghost" style="display:none">See the next draw</button>
</div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const track = window.FIREBIRD_TRACK || function (e, d) { console.log('[track]', e, d || {}); };

  /* The version of THIS FILE, hard-coded. site.json's build number travels
     independently and is always fetched fresh, so showing that number would
     tell you the server is up to date while the phone is still running an old
     index.html out of cache — a stale page wearing a current badge. The stamp
     on screen is this constant, which can only be right. */
  const CODE_BUILD = '15-rotatefix';

  const params = new URLSearchParams(location.search);
  let campaignId = (params.get('c') || '').replace(/[^a-z0-9_-]/gi, '');
  let BUILD = '0';

  const ua = navigator.userAgent || '';
  const inApp = /FBAN|FBAV|Instagram|Line\/|Twitter|WhatsApp|MicroMessenger/i.test(ua);
  const secure = location.protocol === 'https:' ||
                 ['localhost', '127.0.0.1'].includes(location.hostname);
  const warn = $('warn');
  if (!secure) {
    warn.classList.add('on');
    warn.textContent = 'This page must be served over HTTPS for the camera to work. Open the hosted https:// link, not a local file.';
  } else if (inApp) {
    warn.classList.add('on');
    warn.textContent = 'You opened this inside another app’s browser, which usually blocks the camera. Tap the ⋯ menu and choose “Open in Safari” or “Open in Chrome”.';
  }

  let C, sceneEl, targetEl, ballEl, shadowEl;
  let TEX = [], BANDS = null, lastBand = -1;
  const ATLAS = [];
  const AGIT = [];

  /* ------------------------------------------------------------ access gate
     A doorman, not a vault: it makes a forwarded link useless, but the code
     lives in the page. Real locking belongs on the host. */
  function gateAccess() {
    return fetch('site.json?t=' + Date.now(), { cache: 'no-store' })
      .then((r) => (r.ok ? r.json() : {})).catch(() => ({}))
      .then((s) => new Promise((resolve) => {
        const code = (s.passcode || '').trim();
        let already = false;
        try { already = sessionStorage.getItem('fb_unlocked') === code && code !== ''; } catch (e) {}
        if (!campaignId) campaignId = (s.defaultCampaign || 'jackpot').replace(/[^a-z0-9_-]/gi, '');
        BUILD = String(s.build || '0');
        $('build').textContent = 'build ' + CODE_BUILD;

        /* If the server has moved on and this page has not, the phone is
           serving a cached index.html. Reload once against a URL it has never
           seen — one shot per server build, so a real mismatch can never
           become a refresh loop. */
        if (BUILD !== '0' && BUILD !== CODE_BUILD) {
          let tried = null;
          try { tried = sessionStorage.getItem('fb_reload_for'); } catch (e) {}
          if (tried !== BUILD) {
            try { sessionStorage.setItem('fb_reload_for', BUILD); } catch (e) {}
            location.replace(location.pathname + '?b=' + encodeURIComponent(BUILD) +
                             (campaignId ? '&c=' + campaignId : ''));
            return;
          }
          $('build').textContent = 'build ' + CODE_BUILD + ' — server has ' + BUILD;
          warn.classList.add('on');
          warn.textContent = 'This page is an old copy held in your browser cache. Close the tab completely and reopen the link to get build ' + BUILD + '.';
        }

        if (!code || already) { $('gate').classList.remove('hide'); return resolve(); }
        $('lockTitle').textContent = s.lockTitle || 'Work in progress';
        $('lockBody').textContent = s.lockBody || 'This is an internal prototype, not a public site.';
        $('lock').classList.remove('hide');
        const attempt = () => {
          if ($('code').value.trim().toLowerCase() === code.toLowerCase()) {
            try { sessionStorage.setItem('fb_unlocked', code); } catch (e) {}
            $('lock').classList.add('hide');
            $('gate').classList.remove('hide');
            resolve();
          } else { $('codeErr').style.visibility = 'visible'; $('code').value = ''; }
        };
        $('unlock').addEventListener('click', attempt);
        $('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') attempt(); });
      }));
  }

  /* Campaigns are looked for beside index.html first, then in campaigns/.
     Root-level wins so a new experience can be added by dropping loose files
     onto the repo, with no folder navigation and nothing to nest wrongly. */
  const loadCampaign = (id) => fetch(id + '.json?v=' + BUILD)
    .then((r) => (r.ok ? r : fetch('campaigns/' + id + '.json?v=' + BUILD)));

  gateAccess().then(() => loadCampaign(campaignId)
    .then((r) => { if (!r.ok) throw new Error('campaign ' + campaignId + ' not found'); return r.json(); })
    .then(boot)
    .catch((e) => {
      $('title').textContent = 'Campaign not found';
      $('intro').textContent = e.message;
      $('start').style.display = 'none';
    }));

  /* --------------------------------------------------------------- the scene */
  function boot(cfg) {
    C = cfg;
    track('session_start', { campaign: C.id });

    const pal = C.palette || {}, root = document.documentElement.style;
    ['ground', 'ink', 'accent', 'ball', 'pop'].forEach((k) => {
      if (pal[k]) root.setProperty('--' + k, pal[k]);
    });
    const copy = C.copy || {};
    $('kicker').textContent = C.kicker || 'FIREBIRD AFRICA';
    $('title').firstChild.textContent = copy.title || C.brand || 'Firebird';
    $('titleAccent').textContent = copy.titleAccent || '';
    $('intro').textContent = copy.intro || '';
    $('start').textContent = 'Start camera';
    $('hint').textContent = copy.scanning || 'Point at the wall';
    $('overLabel').textContent = copy.overLabel || '';
    $('overTitle').textContent = copy.overTitle || 'Your numbers';
    if (C.reward && C.reward.url) {
      $('overCta').style.display = '';
      $('overCta').textContent = C.reward.cta || 'Find out more';
      $('overCta').addEventListener('click', () => window.open(C.reward.url, '_blank', 'noopener'));
    }

    /* A campaign may give one texture or a sheet of bands. Bands are the real
       thing: in the South African draw a ball's colour is fixed by its number,
       so the colour is information rather than decoration. */
    BANDS = (C.ball && C.ball.bands) || null;

    document.body.insertAdjacentHTML('beforeend',
      '<a-scene mindar-image="imageTargetSrc: ' + C.target + '?v=' + BUILD + '; autoStart: false; ' +
        'uiScanning: no; uiLoading: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.005; ' +
        'missTolerance: 6; warmupTolerance: 3" ' +
        'color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true" ' +
        'vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">' +
        '<a-camera position="0 0 0" look-controls="enabled: false"></a-camera>' +
        '<a-entity id="target" mindar-image-target="targetIndex: 0">' +
          '<a-entity light="type: ambient; intensity: 0.92"></a-entity>' +
          '<a-entity light="type: directional; intensity: 0.5" position="0.4 0.7 1"></a-entity>' +
          '<a-ring id="shadow" position="0 -0.5 0.002" radius-inner="0" radius-outer="0.05" ' +
            'material="color:#000; opacity:.22; transparent:true; side:double"></a-ring>' +
          '<a-sphere id="ball" radius="' + ((C.ball && C.ball.radius) || 0.035) + '" ' +
            'position="0 0 0.02" segments-width="32" segments-height="24" ' +
            'material="color:' + ((BANDS && BANDS[0][3]) || pal.ball || '#eb6e18') + '; ' +
            'roughness:.28; metalness:.06"></a-sphere>' +
        '</a-entity>' +
      '</a-scene>');

    sceneEl = document.querySelector('a-scene');
    targetEl = $('target'); ballEl = $('ball'); shadowEl = $('shadow');
    ballEl.object3D.visible = false;
    shadowEl.object3D.visible = false;
    targetEl.addEventListener('targetFound', onFound);
    targetEl.addEventListener('targetLost', onLost);

    if (C.ball && C.ball.atlas) loadAtlas(C.ball.atlas);
    buildMisses();
    watchOrientation();
    $('start').addEventListener('click', startCamera);
    $('again').addEventListener('click', () => { $('over').classList.add('hide'); resetRound(); });
    $('share').addEventListener('click', share);
    window.addEventListener('pointerdown', onTap);
  }

  /* ------------------------------------------------------------- ball atlas
     One image holding every band's map, stacked top to bottom, sliced once
     here. Cheaper to upload and to serve than eight files, and it means a ball
     never changes colour a frame late waiting on a fetch. If the sheet fails
     to load the ball keeps a flat band colour, so the round still plays. */
  function loadAtlas(src) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      const THREE = AFRAME.THREE, rows = BANDS ? BANDS.length : 1, h = img.height / rows;
      for (let i = 0; i < rows; i++) {
        const cv = document.createElement('canvas');
        cv.width = img.width; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, i * h, img.width, h, 0, 0, img.width, h);
        const t = new THREE.CanvasTexture(cv);
        t.colorSpace = THREE.SRGBColorSpace || t.colorSpace;
        t.anisotropy = 4;
        ATLAS[i] = t;
      }
      TEX = ATLAS;
      if (DRAW.ball) setBallTexture(DRAW.ball.n);
    };
    img.onerror = () => track('atlas_failed', { campaign: C.id });
    img.src = src + '?v=' + BUILD;
  }

  /* Which band a number belongs to. Bands are [low, high, row, hex] and the
     last one is open-ended, so extending the game's range never leaves a
     number without a colour. */
  function bandOf(n) {
    if (!BANDS) return -1;
    for (let i = 0; i < BANDS.length; i++) if (n >= BANDS[i][0] && n <= BANDS[i][1]) return i;
    return BANDS.length - 1;
  }

  function setBallTexture(n) {
    const i = bandOf(n);
    if (i < 0) return;
    lastBand = i;
    const m = ballEl.getObject3D('mesh');
    if (!m) return;
    if (ATLAS[i]) {
      m.material.map = ATLAS[i];
      m.material.color.setHex(0xffffff);
    } else if (BANDS[i][3]) {
      m.material.color.set(BANDS[i][3]);     // sheet not in yet — hold the band colour
    }
    m.material.needsUpdate = true;
  }

  /* ------------------------------------------------------- turning the phone
     Two separate things break when a phone is rotated, and they need two
     separate fixes.

     1. GEOMETRY. MindAR recomputes the camera's field of view and the video's
        letterboxing on the window's resize event. On a phone that event
        arrives while the viewport still reports its old width and height, so
        it latches onto the orientation you just left. Running its layout pass
        again a few times across the half-second a phone takes to settle fixes
        that; it is idempotent, so repeating it costs nothing.

     2. THE TRACKER ITSELF. This is the one that actually stops the game.
        MindAR builds its detector once, from the camera's frame size:

            new Controller({ inputWidth: video.videoWidth, ... })

        Every image pyramid and the projection matrix are sized from those
        numbers. On Android the live camera track SWAPS width and height when
        the device turns, so from that moment every frame arrives the wrong
        shape, detection fails outright, and the board can never be re-found —
        until you turn back, when it matches again and works instantly. No
        amount of resizing helps, because the detector is the wrong shape, not
        the view.

        The only cure is to rebuild the tracker. Stopping and starting the
        system does that: the camera permission is already granted so there is
        no second prompt, and the round's state lives in DRAW rather than in
        the tracker, so caught numbers and misses survive the rebuild.

     The restart is triggered by what actually went wrong rather than by
     guessing the device: either the video's dimensions changed, or tracking
     failed to come back shortly after a rotation. That covers phones whose
     streams rotate and phones whose streams do not. */
  let arStarted = false, restarting = false, lastRestart = 0;
  let lastVideoDims = null, rotatedAt = 0, relayoutPending = 0;

  const arSystem = () => sceneEl && sceneEl.systems && sceneEl.systems['mindar-image-system'];
  const arVideo = () => { const s = arSystem(); return s && s.video; };

  function relayout() {
    if (!sceneEl) return;
    const sys = arSystem();
    if (sys && typeof sys._resize === 'function' && sys.video && sys.video.videoWidth) {
      try { sys._resize(); } catch (e) {}
    }
    if (sceneEl.renderer && sceneEl.canvas) {
      const w = window.innerWidth, h = window.innerHeight;
      if (sceneEl.canvas.width !== w || sceneEl.canvas.height !== h) {
        try { sceneEl.renderer.setSize(w, h, false); } catch (e) {}
      }
    }
  }

  function restartAR(why) {
    const sys = arSystem();
    const now = Date.now();
    if (!sys || !arStarted || restarting || now - lastRestart < 4000) return;
    restarting = true;
    lastRestart = now;
    track('ar_restart', { campaign: C.id, why: why });
    if (G.tracked) onLost();                 // park the round before the gap
    /* MindAR only emits targetFound on a transition from invisible to
       visible. Tearing the tracker down leaves the anchor still flagged
       visible from before, so when the new tracker re-finds the board there
       is no transition, no event, and the round stays paused forever while
       the picture looks perfectly fine. Clear the flag so the next lock
       counts as a find. */
    if (targetEl && targetEl.object3D) targetEl.object3D.visible = false;
    $('hint').textContent = C.copy.scanning || 'Point at the wall';
    try { sys.stop(); } catch (e) {}
    arStarted = false;
    lastVideoDims = null;
    setTimeout(() => {
      try { sys.start(); } catch (e) {}
      restarting = false;
    }, 150);
  }

  /* Did the camera change shape under us, or quietly stop? */
  function checkTracker() {
    if (!arStarted || restarting) return;
    const v = arVideo();
    if (!v || !v.videoWidth) return;
    if (v.paused) { try { v.play(); } catch (e) {} }
    const dims = v.videoWidth + 'x' + v.videoHeight;
    if (lastVideoDims && dims !== lastVideoDims) {
      return restartAR('camera frame changed ' + lastVideoDims + ' -> ' + dims);
    }
    lastVideoDims = dims;
  }

  function scheduleRelayout() {
    rotatedAt = Date.now();
    clearTimeout(relayoutPending);
    [0, 120, 320, 650].forEach((ms) => { relayoutPending = setTimeout(relayout, ms); });
    [260, 700, 1300].forEach((ms) => setTimeout(checkTracker, ms));
    // Last resort: the stream kept its shape but the board still will not come
    // back. Rebuild anyway rather than leave someone staring at a dead wall.
    setTimeout(() => {
      if (arStarted && !G.tracked && Date.now() - rotatedAt >= 2200) {
        restartAR('no lock ' + Math.round((Date.now() - rotatedAt) / 100) / 10 + 's after rotating');
      }
    }, 2600);
  }

  function watchOrientation() {
    window.addEventListener('orientationchange', scheduleRelayout);
    window.addEventListener('resize', scheduleRelayout);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleRelayout);
    if (screen.orientation && screen.orientation.addEventListener)
      screen.orientation.addEventListener('change', scheduleRelayout);
    // Fires again after every rebuild, not just the first start.
    sceneEl.addEventListener('arReady', () => {
      arStarted = true;
      const v = arVideo();
      lastVideoDims = v && v.videoWidth ? v.videoWidth + 'x' + v.videoHeight : null;
      relayout();
    });
    setInterval(checkTracker, 1500);
  }

  /* ----------------------------------------------------------------- camera
     MindAR's start() returns nothing — it reports through events on the scene,
     so success is 'arReady' and failure is 'arError'. Treating it as a promise
     throws, leaves the start screen covering a running scene, and makes the
     whole thing look broken when the camera is in fact working. */
  function startCamera() {
    const btn = $('start');
    btn.disabled = true;
    btn.textContent = 'Starting…';

    let settled = false;
    const ok = () => {
      if (settled) return;
      settled = true;
      clearTimeout(bail);
      $('gate').classList.add('hide');
      $('hud').classList.add('on');
      if (G.phase === 'idle') G.phase = 'scan';
      track('camera_started', { campaign: C.id });
    };
    const fail = (why) => {
      if (settled) return;
      settled = true;
      clearTimeout(bail);
      btn.disabled = false;
      btn.textContent = 'Start camera';
      warn.classList.add('on');
      warn.textContent = 'The camera could not start. Check that this site is allowed to use the camera in your browser settings, then tap Start again.';
      track('camera_failed', { campaign: C.id, error: String(why) });
    };

    sceneEl.addEventListener('arReady', ok, { once: true });
    sceneEl.addEventListener('arError', (e) => fail((e.detail && e.detail.error) || 'arError'), { once: true });
    // If neither event arrives the permission prompt was most likely dismissed.
    const bail = setTimeout(() => fail('timeout'), 20000);

    const go = () => {
      try {
        const sys = sceneEl.systems['mindar-image-system'];
        if (!sys) return fail('no mindar system');
        const maybe = sys.start();
        if (maybe && typeof maybe.then === 'function') maybe.then(ok).catch(fail);
      } catch (e) { fail(e && e.message || e); }
    };
    if (sceneEl.hasLoaded) go(); else sceneEl.addEventListener('loaded', go, { once: true });
  }

  /* ------------------------------------------------------------- the round
     A ball rolls out of the drum and down the rail painted on the wall. Catch
     it before it reaches the chute and its number drops into a port; let it
     go and the number is lost. Three losses end the round. */
  const G = { phase: 'idle', tracked: false, last: 0 };
  const DRAW = { picked: [], ball: null, discs: [], lost: 0, speed: 1, paused: false };

  function rand(max) {
    if (window.crypto && crypto.getRandomValues) {
      const a = new Uint32Array(1);
      const limit = Math.floor(0xffffffff / max) * max;
      do { crypto.getRandomValues(a); } while (a[0] >= limit);
      return (a[0] % max) + 1;
    }
    return Math.floor(Math.random() * max) + 1;
  }

  function drawNumber() {
    const max = C.draw.maxNumber || 52;
    let n;
    do { n = rand(max); } while (DRAW.picked.includes(n));
    return n;
  }

  function buildMisses() {
    const max = C.draw.maxMisses || 3, box = $('misses');
    box.innerHTML = '';
    for (let i = 0; i < max; i++) box.appendChild(document.createElement('i'));
  }
  function paintMisses() {
    const dots = $('misses').children;
    for (let i = 0; i < dots.length; i++)
      dots[i].className = i < DRAW.lost ? 'spent' : '';
  }

  let sayTimer = 0;
  function say(text, ms) {
    const el = $('say');
    el.textContent = text;
    el.classList.add('on');
    clearTimeout(sayTimer);
    sayTimer = setTimeout(() => el.classList.remove('on'), ms || 900);
  }

  /* The rail is a quadratic bezier when the campaign supplies a control point,
     so the ball can follow a painted curve rather than only a straight ramp.
     Omit rampCtrl and it degrades to the straight line it used to be. */
  function rampPoint(t) {
    const a = C.draw.rampStart, b = C.draw.rampEnd, c = C.draw.rampCtrl;
    if (!c) return { x: a[0] + (b[0] - a[0]) * t, y: a[1] + (b[1] - a[1]) * t };
    const m = 1 - t;
    return { x: m * m * a[0] + 2 * m * t * c[0] + t * t * b[0],
             y: m * m * a[1] + 2 * m * t * c[1] + t * t * b[1] };
  }

  function spawnBall(delay) {
    const n = drawNumber();
    DRAW.ball = { stage: 'wait', wait: delay == null ? 0.5 : delay, t: 0, n: n,
                  x: 0, y: 0, vy: 0 };
    ballEl.object3D.visible = false;
    shadowEl.object3D.visible = false;
    setBallTexture(n);
  }

  function placeBall(x, y, z) {
    ballEl.object3D.position.set(x, y, z);
    ballEl.object3D.visible = true;
    // The shadow only reads while the ball is over the artwork; off the edge
    // it becomes a grey disc floating in mid air.
    const over = y > (C.draw.missY || -0.26) + 0.02;
    shadowEl.object3D.visible = over;
    if (over) shadowEl.object3D.position.set(x, y - 0.035, 0.003);
  }

  function makeDisc(n) {
    const S = 256, cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const g = cv.getContext('2d');
    g.clearRect(0, 0, S, S);
    g.fillStyle = C.draw.discFill || '#f8f4e8';
    g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 8, 0, 6.284); g.fill();
    // The ring keeps the colour of the ball it came from, so a filled port
    // still reads as the orange one, the blue one — the band survives the catch.
    const bi = bandOf(n);
    g.lineWidth = 13;
    g.strokeStyle = (bi >= 0 && BANDS[bi][3]) || C.palette.accent || '#ecbe48';
    g.stroke();
    const grad = g.createRadialGradient(S * 0.36, S * 0.3, 8, S * 0.5, S * 0.5, S * 0.6);
    grad.addColorStop(0, 'rgba(255,255,255,.85)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad; g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 14, 0, 6.284); g.fill();
    g.fillStyle = C.draw.discInk || '#14110f';
    g.font = 'bold ' + (n > 9 ? 112 : 128) + 'px -apple-system, Helvetica, Arial, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(String(n), S / 2, S / 2 + 6);

    const THREE = AFRAME.THREE;
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace || tex.colorSpace;
    const mesh = new THREE.Mesh(
      new THREE.CircleGeometry(C.draw.discRadius || 0.04, 40),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true })
    );
    targetEl.object3D.add(mesh);
    return mesh;
  }

  /* Balls tumbling in the painted drum, in the machine colours, so the one
     that rolls out looks like it came from there rather than from nowhere. */
  function buildAgitator() {
    if (AGIT.length || !C.draw.drum) return;
    const THREE = AFRAME.THREE, cfg = C.draw;
    const pal = (BANDS && BANDS.map((b) => b[3]).filter(Boolean)) ||
                ['#d02a28', '#1c60ba', '#1a8e4e', '#f6c216', '#7c3e9e', '#e8701a'];
    const n = cfg.drumBalls || 6;
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(cfg.drumBallRadius || 0.018, 18, 14),
        new THREE.MeshStandardMaterial({ color: new THREE.Color(pal[i % pal.length]),
                                         roughness: 0.32, metalness: 0.05 })
      );
      m.userData.a = (i / n) * Math.PI * 2;
      m.userData.r = (cfg.drumRadius || 0.06) * (0.3 + 0.6 * ((i * 7 % 5) / 5));
      m.userData.sp = 0.7 + (i % 3) * 0.35;
      targetEl.object3D.add(m);
      AGIT.push(m);
    }
  }

  function stepAgitator(dt) {
    if (!AGIT.length) return;
    const c = C.draw.drum;
    for (const m of AGIT) {
      const u = m.userData;
      u.a += dt * u.sp * 1.1;
      m.position.set(c[0] + Math.cos(u.a) * u.r,
                     c[1] + Math.sin(u.a * 1.3) * u.r * 0.8,
                     0.03 + Math.sin(u.a * 0.7) * 0.012);
      m.rotation.y = u.a * 2;
    }
  }

  function startRound() {
    DRAW.picked = []; DRAW.lost = 0; DRAW.speed = 1; DRAW.paused = false;
    DRAW.discs.forEach((m) => targetEl.object3D.remove(m));
    DRAW.discs = [];
    $('score').textContent = '0';
    paintMisses();
    G.phase = 'draw';
    $('hint').textContent = '';
    buildAgitator();
    spawnBall(0.7);
    track('round_start', { campaign: C.id });
  }

  function resetRound() {
    if (G.tracked) startRound();
    else { G.phase = 'scan'; $('hint').textContent = C.copy.scanning || 'Point at the wall'; }
  }

  function stepDraw(dt) {
    const b = DRAW.ball, cfg = C.draw;
    if (!b) return;

    if (b.stage === 'wait') {
      b.wait -= dt;
      if (b.wait <= 0) {
        b.stage = 'roll'; b.t = 0;
        say(C.copy.incoming || 'HERE IT COMES', 700);
      }
      return;
    }

    if (b.stage === 'roll') {
      // gentle acceleration down the rail, and faster with every ball drawn
      const secs = (cfg.rollSecs || 2.5) / DRAW.speed;
      b.t += dt / secs;
      const pt = rampPoint(Math.min(1, b.t));
      b.x = pt.x; b.y = pt.y;
      placeBall(b.x, b.y, cfg.rollZ || 0.022);
      ballEl.object3D.rotation.y += dt * 6.5;
      ballEl.object3D.rotation.x -= dt * 1.1;
      if (b.t >= 1) { b.stage = 'fall'; b.vy = -0.05; }
      return;
    }

    if (b.stage === 'fall') {
      b.vy -= (cfg.fallGravity || 0.8) * dt;
      b.y += b.vy * dt;
      b.x += (cfg.fallDrift || 0.06) * dt;
      placeBall(b.x, b.y, cfg.rollZ || 0.022);
      ballEl.object3D.rotation.y += dt * 5;
      if (b.y <= (cfg.missY || -0.26)) {
        DRAW.lost += 1;
        paintMisses();
        say(C.copy.miss || 'MISSED!', 900);
        $('hint').textContent = C.copy.missHint || 'that number is gone';
        setTimeout(() => { if (G.phase === 'draw') $('hint').textContent = ''; }, 1100);
        track('number_missed', { campaign: C.id, lost: DRAW.lost });
        ballEl.object3D.visible = false;
        shadowEl.object3D.visible = false;
        DRAW.ball = null;
        if (DRAW.lost >= (cfg.maxMisses || 3)) return finishDraw();
        return spawnBall(cfg.gapSecs || 0.9);
      }
      return;
    }

    if (b.stage === 'toSlot') {
      b.t += dt / (cfg.toSlotSecs || 0.6);
      const k = Math.min(1, b.t), e = 1 - Math.pow(1 - k, 3);
      const m = b.mesh;
      if (m) {
        m.position.set(b.from[0] + (b.slot[0] - b.from[0]) * e,
                       b.from[1] + (b.slot[1] - b.from[1]) * e, 0.012);
        const s = 1.45 - 0.45 * e;
        m.scale.set(s, s, s);
      }
      if (k >= 1) {
        if (m) { m.position.set(b.slot[0], b.slot[1], 0.012); m.scale.set(1, 1, 1); DRAW.discs.push(m); }
        DRAW.ball = null;
        if (DRAW.picked.length >= (cfg.count || 6)) return finishDraw();
        return spawnBall(cfg.gapSecs || 0.9);
      }
    }
  }

  function catchBall(b) {
    const cfg = C.draw;
    DRAW.picked.push(b.n);
    $('score').textContent = String(DRAW.picked.length);
    say(C.copy.caught || 'CAUGHT IT', 700);
    track('number_caught', { campaign: C.id, n: b.n, index: DRAW.picked.length });
    DRAW.speed = Math.min(cfg.maxSpeed || 2.2, DRAW.speed + (cfg.speedStep || 0.16));

    ballEl.object3D.visible = false;
    shadowEl.object3D.visible = false;
    b.mesh = makeDisc(b.n);
    b.from = [b.x, b.y];
    b.slot = (cfg.slots && cfg.slots[DRAW.picked.length - 1]) || [0, -0.145];
    b.mesh.position.set(b.x, b.y, 0.012);
    b.stage = 'toSlot';
    b.t = 0;
  }

  function finishDraw() {
    G.phase = 'over';
    ballEl.object3D.visible = false;
    shadowEl.object3D.visible = false;
    $('hud').classList.remove('on');
    const sorted = DRAW.picked.slice().sort((a, b) => a - b);
    const box = $('nums');
    box.innerHTML = '';
    sorted.forEach((n) => {
      const b = document.createElement('b');
      b.textContent = n;
      const bi = bandOf(n);
      if (bi >= 0 && BANDS[bi][3]) b.style.borderColor = BANDS[bi][3];
      box.appendChild(b);
    });
    const ranOut = DRAW.lost >= (C.draw.maxMisses || 3) && DRAW.picked.length < (C.draw.count || 6);
    $('overTitle').textContent = ranOut ? (C.copy.outOfBalls || 'Out of balls')
                                        : (C.copy.overTitle || 'Your six numbers');
    $('overBody').textContent = (C.reward && C.reward.body ? C.reward.body : '') +
      (ranOut ? ' You dropped ' + DRAW.lost + ' and ran out before the set was full.'
              : DRAW.lost ? ' You let ' + DRAW.lost + ' ball' + (DRAW.lost > 1 ? 's' : '') + ' drop.' : '');
    $('over').classList.remove('hide');
    track('draw_complete', { campaign: C.id, numbers: sorted, lost: DRAW.lost });
  }

  function share() {
    const sorted = DRAW.picked.slice().sort((a, b) => a - b).join(', ');
    const text = (C.copy.shareText || 'The wall picked my numbers:') + ' ' + sorted +
                 ' — ' + (C.brand || 'Firebird Africa') + '.';
    if (navigator.share) navigator.share({ text: text }).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(text)
      .then(() => say('Copied', 1200)).catch(() => {});
  }

  /* ------------------------------------------------------------ hit testing
     Project the ball to screen coordinates and compare with the tap, rather
     than raycasting. Outdoors, at arm's length, with the phone moving, a
     forgiving circle around where the ball appears is far kinder than a ray
     that has to strike a small sphere exactly.

     The apparent radius is measured by projecting a second point one ball-
     radius to the camera's right and taking the pixel gap. Deriving it from
     the local radius and the world distance instead gives zero, because MindAR
     scales the target's world space — and a zero-radius tap target means
     nothing is ever catchable. */
  function ballScreen() {
    if (!ballEl || !ballEl.object3D.visible || !sceneEl || !sceneEl.camera) return null;
    const THREE = AFRAME.THREE;
    const cam = sceneEl.camera;

    const world = new THREE.Vector3();
    ballEl.object3D.getWorldPosition(world);
    const v = world.clone().project(cam);
    if (v.z > 1) return { behind: true };

    const scale = new THREE.Vector3();
    ballEl.object3D.getWorldScale(scale);
    const worldR = ((C.ball && C.ball.radius) || 0.035) *
                   Math.max(scale.x, scale.y, scale.z);

    const right = new THREE.Vector3();
    cam.matrixWorld.extractBasis(right, new THREE.Vector3(), new THREE.Vector3());
    const edge = world.clone().addScaledVector(right, worldR).project(cam);

    const W = window.innerWidth, H = window.innerHeight;
    const r = Math.abs(edge.x - v.x) / 2 * W;
    return {
      behind: false,
      x: (v.x + 1) / 2 * W,
      y: (-v.y + 1) / 2 * H,
      r: r,
    };
  }

  function onTap(ev) {
    if (G.phase === 'ready') { startRound(); return; }
    if (G.phase !== 'draw' || DRAW.paused) return;
    const b = DRAW.ball;
    if (!b || (b.stage !== 'roll' && b.stage !== 'fall')) return;
    const s = ballScreen();
    if (!s || s.behind) return;
    const dx = ev.clientX - s.x, dy = ev.clientY - s.y;
    // A thumb is about 40px across. Never let the catchable area fall below
    // that, however small or far away the ball happens to render.
    const reach = Math.max(44, s.r * (C.draw.tapForgiveness || 1.9));
    if (dx * dx + dy * dy <= reach * reach) catchBall(b);
  }

  /* ------------------------------------------------------- tracking changes */
  function onFound() {
    G.tracked = true;
    if (G.phase === 'over') return;
    if (G.phase === 'draw' && DRAW.paused) {
      DRAW.paused = false;
      /* A number that was flying into its port when the board went out of
         view is parked there by onLost, which leaves nothing in flight.
         Without this the round resumes and then sits frozen forever, waiting
         on a ball that was never spawned. */
      if (!DRAW.ball) {
        if (DRAW.picked.length >= (C.draw.count || 6)) return finishDraw();
        spawnBall(C.draw.gapSecs || 0.9);
      }
      say(C.copy.resumed || 'BACK ON', 700);
      return;
    }
    if (G.phase === 'draw') return;
    G.phase = 'ready';
    $('hint').textContent = C.copy.tapToPlay || 'Tap to start';
  }

  function onLost() {
    G.tracked = false;
    if (G.phase === 'draw') {
      DRAW.paused = true;
      /* A number caught in the last instant would otherwise be stranded
         mid-flight; snap it home so the port is filled when you look back. */
      const b = DRAW.ball;
      if (b && b.stage === 'toSlot' && b.mesh) {
        b.mesh.position.set(b.slot[0], b.slot[1], 0.012);
        b.mesh.scale.set(1, 1, 1);
        DRAW.discs.push(b.mesh);
        DRAW.ball = null;
      }
      ballEl.object3D.visible = false;
      shadowEl.object3D.visible = false;
      $('hint').textContent = C.copy.scanning || 'Point at the wall';
    } else if (G.phase === 'ready') {
      G.phase = 'scan';
      $('hint').textContent = C.copy.scanning || 'Point at the wall';
    }
  }

  /* ------------------------------------------------------------------ clock */
  function tick(now) {
    requestAnimationFrame(tick);
    const dt = Math.min(0.05, (now - (G.last || now)) / 1000);
    G.last = now;
    if (!C || !targetEl) return;

    /* The anchor's own visibility flag is the truth about whether the board
       is in view. The found/lost events are a convenience on top of it, and
       they can be missed — across a tracker rebuild, or if two transitions
       land in the same frame. Reconcile every frame so a missed event can
       never strand the round. */
    if (arStarted && !restarting) {
      const vis = !!(targetEl.object3D && targetEl.object3D.visible);
      if (vis && !G.tracked) onFound();
      else if (!vis && G.tracked) onLost();
    }

    if (G.tracked) stepAgitator(dt);
    if (G.phase === 'draw' && !DRAW.paused) {
      /* Last line of defence against a stalled round: if play is live and
         nothing is in flight for a couple of seconds, something swallowed a
         ball. Serve another rather than leave a player staring at a wall. */
      if (!DRAW.ball) {
        G.idle = (G.idle || 0) + dt;
        if (G.idle > 2) {
          G.idle = 0;
          if (DRAW.picked.length >= (C.draw.count || 6)) finishDraw();
          else spawnBall(0.3);
        }
      } else { G.idle = 0; }
      stepDraw(dt);
    }
  }
  requestAnimationFrame(tick);

  window.FIREBIRD_DEBUG = {
    G: G, DRAW: DRAW, config: () => C, startRound: startRound,
    ballScreen: () => ballScreen(),
    ballBand: () => ({ band: lastBand, fromAtlas: !!ATLAS[lastBand] }),
    dressBall: (n) => setBallTexture(n),
    restartAR: (why) => restartAR(why || 'manual'),
    arState: () => ({ started: arStarted, restarting: restarting, dims: lastVideoDims }),
    codeBuild: CODE_BUILD,
  };
})();
</script>
</body>
</html>
