<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>What's Cooking? 2 · Banner AR</title>
<meta name="theme-color" content="#0f3a7a">
<script src="./vendor/aframe.min.js"></script>
<script src="./vendor/mindar-image-aframe.prod.js"></script>
<style>
  @font-face{font-family:"KidsRock";src:url(assets/fonts/kidsrock.woff2) format("woff2");font-display:swap}
  @font-face{font-family:"Fredoka";font-weight:300 700;src:url(assets/fonts/fredoka.woff2) format("woff2");font-display:swap}
  :root{ --ink:#141a33; --orange:#fdaa00; --orange2:#f08a00; --blue:#2f8cff; --panel:rgba(12,32,74,.92); }
  *{box-sizing:border-box}
  /* MindAR puts its camera <video> straight into <body>; the body must stay see-through */
  html{background:#000;height:100%;margin:0}
  body{margin:0;height:100%;overflow:hidden;background:transparent;color:#fff;
    font-family:"Fredoka",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body > video{z-index:0 !important}
  a-scene{position:fixed!important;inset:0;z-index:1}
  .card{position:fixed;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,560px);max-height:92vh;overflow:auto;
    background:var(--panel);border:3px solid #fff;border-radius:26px;padding:20px 20px 18px;text-align:center;
    box-shadow:0 14px 40px rgba(0,0,0,.45);transition:opacity .25s, transform .25s}
  .card.hide{opacity:0;pointer-events:none;transform:translate(-50%,-46%) scale(.97)}
  .card img.logo{width:min(70%,300px);display:block;margin:0 auto 6px}
  .card h2{margin:6px 0 4px;font-size:21px;font-weight:700}
  .card p{margin:4px 0 12px;font-size:15px;line-height:1.35;opacity:.92}
  .chars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:10px 0 14px}
  .chars button{appearance:none;border:3px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);border-radius:16px;padding:6px 2px 4px;cursor:pointer;color:#fff;font-family:inherit;font-weight:600;font-size:min(10.5px,2.35vw);line-height:1.1;letter-spacing:0;white-space:nowrap;overflow:hidden}
  .chars button img{display:block;height:58px;width:100%;object-fit:contain;margin-bottom:3px;pointer-events:none}
  .chars button[aria-pressed=true]{border-color:var(--orange);background:rgba(253,170,0,.22)}
  .btn{appearance:none;display:inline-block;text-decoration:none;border:3px solid #fff;border-radius:999px;padding:13px 26px;font-size:18px;line-height:1;letter-spacing:.03em;color:#fff;cursor:pointer;
    background:linear-gradient(#ffc23d,#f08a00);box-shadow:0 5px 0 #a35600,0 9px 18px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(120,50,0,.6)}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a35600}
  .btn.blue{background:linear-gradient(#5ab4ff,#1f6fe0);box-shadow:0 5px 0 #0d3f8f,0 9px 18px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,30,90,.6)}
  .btn.small{font-size:15px;padding:10px 18px}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  input.code{font-family:inherit;font-weight:600;font-size:20px;padding:10px 14px;border-radius:14px;border:2px solid #fff;width:200px;text-align:center;margin:4px 0 10px}
  small.err{display:block;color:#ffb3a8;min-height:18px}
  .hud{position:fixed;z-index:5;left:0;right:0;text-align:center;pointer-events:none}
  #scan{top:50%;transform:translateY(-50%);display:none}
  #scan.on{display:block}
  #scan .frame{width:min(78vw,78vh*2);aspect-ratio:2/1;margin:0 auto;border:4px dashed rgba(255,255,255,.8);border-radius:18px;animation:pulse 1.6s ease-in-out infinite}
  @media (orientation:landscape){ #sideways{display:none!important} }
  #scan b{display:inline-block;margin-top:12px;background:var(--panel);padding:8px 16px;border-radius:999px;font-size:16px}
  @keyframes pulse{50%{opacity:.45;transform:scale(.985)}}
  #say{bottom:calc(9vh + env(safe-area-inset-bottom));opacity:0;transition:opacity .2s}
  #say.on{opacity:1}
  #say span{display:inline-block;font-size:clamp(22px,6vw,40px);line-height:1;letter-spacing:.03em;color:#fff;padding:10px 22px;border-radius:999px;
    background:linear-gradient(#ffc23d,#f08a00);border:3px solid #fff;box-shadow:0 5px 0 #a35600;text-shadow:0 2px 0 rgba(120,50,0,.6)}
  #say.bounce span{animation:bounce .55s ease-in-out infinite}
  @keyframes bounce{50%{transform:translateY(-8px) scale(1.04)}}
  #timer{top:calc(12px + env(safe-area-inset-top));display:none}
  #timer.on{display:block}
  #timer span{background:var(--panel);border:2px solid #fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:18px;line-height:1}
  #warn{color:#ffd0c8;font-size:14px;min-height:0}
  #dbg{position:fixed;left:6px;bottom:4px;z-index:20;font-size:10px;opacity:.5;pointer-events:none}
  .big{font:400 36px/1.05 "KidsRock","Fredoka",sans-serif;margin:6px 0 2px;color:#ffd04d;text-shadow:0 3px 0 rgba(0,0,0,.35)}
  #over img.hero{height:110px;display:block;margin:0 auto -4px}
  .card h2{font-family:"KidsRock","Fredoka",sans-serif;font-weight:400;letter-spacing:.02em}
  #say span,.btn{font-family:"KidsRock","Fredoka",sans-serif;font-weight:400;letter-spacing:.04em}
  /* phones held sideways: everything on one screen */
  @media (max-height:520px){
    .card{padding:12px 16px 12px;border-radius:20px}
    .card img.logo{width:150px;margin-bottom:0}
    .card h2{font-size:17px;margin:2px 0}
    .chars{grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;margin:6px 0 10px}
    .chars button{padding:4px 1px 3px;font-size:min(8.5px,1.1vw);border-radius:12px}
    .chars button img{height:40px}
    .card p{font-size:13px;margin:2px 0 8px}
    #over img.hero{height:70px}
    .big{font-size:28px}
    .btn{padding:11px 22px;font-size:16px}
  }
</style>
</head>
<body>

<div id="lock" class="card hide">
  <img class="logo" src="assets/title.webp" alt="What's Cooking? 2: The Fridge Is Full">
  <h2>Preview</h2>
  <p>Enter the passcode you were sent.</p>
  <form id="codeForm"><input class="code" id="code" autocomplete="off" inputmode="text"><br>
  <button class="btn small" type="submit">Enter</button></form>
  <small class="err" id="codeErr"></small>
</div>

<div id="gate" class="card hide">
  <img class="logo" src="assets/title.webp" alt="What's Cooking? 2: The Fridge Is Full">
  <h2>Pick your character</h2>
  <div class="chars" id="chars" role="group" aria-label="Characters"></div>
  <button class="btn" id="start" type="button">Start camera</button>
  <p style="margin:12px 0 0;font-size:13.5px">Point your phone at the banner. Tap to jump up the shelves and reach the finish.</p>
  <div id="warn"></div>
</div>

<div id="over" class="card hide">
  <img class="hero" id="overHero" alt="">
  <div class="big">You made it!</div>
  <p id="overTime"></p>
  <div class="row"><a class="btn" id="playGame" href="#">PLAY THE FULL GAME</a></div>
  <div class="row" style="margin-top:12px"><button class="btn blue small" id="again" type="button">Run again</button></div>
</div>

<div class="hud" id="scan"><div class="frame"></div><b>Point at the banner</b><br><small id="sideways" style="display:inline-block;margin-top:8px;background:var(--panel);padding:5px 12px;border-radius:999px">Tip: hold your phone sideways for a bigger view</small></div>
<div class="hud" id="say"><span id="sayText"></span></div>
<div class="hud" id="timer"><span id="timerText">0.0s</span></div>
<div id="dbg"></div>

<script>
(() => {
'use strict';
/* ===================== settings ===================== */
const SET = {
  passcode: '',                                                  /* '' = no passcode screen */
  game: 'https://eddyhutchons-lab.github.io/TFIF-Game/?src=billboard',
  target: 'targets/billboard.mind',
  version: '4',
  /* the run course: where the printed shelves are on the billboard (0..1 across, 0..1 down) */
  course: { aspect: 0.5, startU: 0.075, finishU: 0.875, charH: 0.20, ledges: [
    { u0: 0.030, u1: 0.360, v: 0.880 }, { u0: 0.360, u1: 0.560, v: 0.740 },
    { u0: 0.560, u1: 0.760, v: 0.600 }, { u0: 0.760, u1: 0.975, v: 0.460 } ] },
  speed: 0.16,       /* board widths a second (0.105 felt slow) */
  jump: 0.56, gravity: 1.45
};
const CHAR_ORDER = ['carrot', 'avocado', 'cheese', 'mustard', 'ketchup', 'lasagna', 'mayo', 'milk', 'pickle', 'sriracha'];
const $ = id => document.getElementById(id);
const track = window.TFIF_TRACK || ((e, d) => console.log('[track]', e, d || {}));
const THREE = AFRAME.THREE;
const C = SET.course, A = C.aspect, CH = C.charH * A;        /* character height in board widths */
const LED = C.ledges.map(L => ({ ...L, top: (1 - L.v) * A }));
let META = null, pick = null;
try { pick = localStorage.getItem('gba-char'); } catch (e) {}

/* ===================== sound ===================== */
let AC = null;
const clips = {};
function audio() {
  if (AC) return; try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  for (const k of ['fanfare', 'cheer']) fetch('assets/snd/snd-' + k + '.mp3').then(r => r.arrayBuffer()).then(b => AC.decodeAudioData(b)).then(d => { clips[k] = d; }).catch(() => {});
}
function play(k, vol = 0.8, at = 0) {
  if (!AC || !clips[k]) return; const s = AC.createBufferSource(), g = AC.createGain(); g.gain.value = vol;
  s.buffer = clips[k]; s.connect(g).connect(AC.destination); s.start(AC.currentTime + at);
}
function blip(f0 = 420, f1 = 880, dur = 0.16, vol = 0.18, type = 'square') {
  if (!AC) return; const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
}

/* ===================== character picker ===================== */
function buildPicker() {
  const box = $('chars');
  box.innerHTML = CHAR_ORDER.map(k => `<button type="button" data-k="${k}" aria-pressed="${k === pick}"><img src="assets/chars/${k}-select.webp" alt="">${k === 'mustard' ? 'MUSTARD' : META[k].name}</button>`).join('');
  box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    pick = b.dataset.k; try { localStorage.setItem('gba-char', pick); } catch (e) {}
    box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); blip(500, 900, 0.1, 0.12);
  }));
  if (!pick || !META[pick]) { pick = 'carrot'; box.querySelector('[data-k=carrot]').setAttribute('aria-pressed', 'true'); }
}

/* ===================== the scene ===================== */
let scene, target, hero, heroMat, shadow, confetti = [];
const tex = {};
const loader = new THREE.TextureLoader();
function T(src) {
  if (!tex[src]) { const t = loader.load(src); if (THREE.SRGBColorSpace) t.colorSpace = THREE.SRGBColorSpace; t.generateMipmaps = false; t.minFilter = THREE.LinearFilter; tex[src] = t; }
  return tex[src];
}
/* each character is one picture strip: the run frames, then idle, jump and fall, in equal cells */
function frames(k) {
  const m = META[k], src = 'assets/chars/' + k + '-sheet.webp?v=' + SET.version, w = m.cw / m.h, n = m.cells;
  const cell = i => ({ src, w, i, n });
  return { run: Array.from({ length: m.run }, (_, i) => cell(i)), idle: cell(m.run), jump: cell(m.run + 1), fall: cell(m.run + 2) };
}
let F = null;
function buildScene() {
  document.body.insertAdjacentHTML('beforeend', `
    <a-scene mindar-image="imageTargetSrc: ${SET.target}?v=${SET.version}; autoStart: false; uiScanning: no; uiLoading: no; uiError: no; filterMinCF: 0.0001; filterBeta: 0.004; missTolerance: 8; warmupTolerance: 3"
      color-space="sRGB" renderer="colorManagement: true; alpha: true" vr-mode-ui="enabled: false" xr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>`);
  scene = document.querySelector('a-scene');
  target = $('target');
  target.addEventListener('targetFound', onFound);
  target.addEventListener('targetLost', onLost);
  const root = new THREE.Group(); target.object3D.add(root);
  /* the character: a picture on a flat card, standing on its feet */
  const geo = new THREE.PlaneGeometry(1, 1); geo.translate(0, 0.5, 0);
  heroMat = new THREE.MeshBasicMaterial({ transparent: true, alphaTest: 0.05, depthWrite: false, side: THREE.DoubleSide });
  hero = new THREE.Mesh(geo, heroMat); hero.renderOrder = 3; hero.visible = false; root.add(hero);
  const sg = new THREE.CircleGeometry(0.5, 28);
  shadow = new THREE.Mesh(sg, new THREE.MeshBasicMaterial({ color: 0x001030, transparent: true, opacity: 0.32, depthWrite: false }));
  shadow.renderOrder = 2; shadow.visible = false; root.add(shadow);
  /* confetti for the finish */
  const cols = [0xffd04d, 0xfd4d00, 0x2f8cff, 0x2ecc71, 0xff5fa2, 0xffffff];
  for (let i = 0; i < 70; i++) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.012, 0.007), new THREE.MeshBasicMaterial({ color: cols[i % cols.length], side: THREE.DoubleSide, transparent: true }));
    m.visible = false; m.renderOrder = 4; root.add(m); confetti.push({ m, v: new THREE.Vector3(), r: new THREE.Vector3() });
  }
  scene.addEventListener('arReady', () => { watchRotation(); }, { once: true });
  scene.addEventListener('arError', () => { $('warn').textContent = 'The camera could not start. Check the browser has permission to use it.'; showGate(); });
}
/* board (u across, height up in board widths) -> the tracked picture's space (centre 0,0; width 1) */
const bx = u => u - 0.5, by = h => h - A / 2;
function setFrame(fr, flip = false) {
  const t = T(fr.src);
  if (heroMat.map !== t) { heroMat.map = t; heroMat.needsUpdate = true; }
  t.repeat.set(1 / fr.n, 1); t.offset.set(fr.i / fr.n, 0);
  hero.scale.set(CH * fr.w * (flip ? -1 : 1) * R.sx, CH * R.sy, 1);
}

/* ===================== the run ===================== */
const R = { phase: 'idle', x: 0, h: 0, vy: 0, on: 0, t: 0, anim: 0, sx: 1, sy: 1, waitT: 0, started: 0, time: 0, tracked: false, landT: 9 };
function say(txt, bounce = false) { $('sayText').textContent = txt; $('say').classList.toggle('on', !!txt); $('say').classList.toggle('bounce', bounce); }
function reset() {
  Object.assign(R, { phase: 'drop', x: C.startU, h: LED[0].top + 0.16, vy: 0, on: -1, t: 0, sx: 1, sy: 1, waitT: 0, time: 0, landT: 9 });
  confetti.forEach(c => (c.m.visible = false));
  hero.visible = true; shadow.visible = true; $('timer').classList.remove('on'); say('');
}
function ledgeUnder(x) { for (let i = LED.length - 1; i >= 0; i--) if (x >= LED[i].u0 - 0.004 && x <= LED[i].u1 + 0.004) return i; return 0; }
function tap() {
  if (!R.tracked) return;
  if ((R.phase === 'run' || R.phase === 'wait' || R.phase === 'ready') && R.on >= 0) {
    if (R.phase === 'ready') go();
    R.vy = SET.jump; R.on = -1; R.phase = 'run'; blip(380, 980, 0.17); say('');
    track('jump');
  }
}
function go() { R.phase = 'run'; R.started = performance.now(); $('timer').classList.add('on'); say('GO!'); setTimeout(() => { if (R.phase === 'run' && $('sayText').textContent === 'GO!') say(''); }, 700); blip(600, 1200, 0.2, 0.15); }
function step(dt) {
  R.anim += dt; R.landT += dt;
  const halfW = CH * 0.18;
  if (R.phase === 'drop' || R.phase === 'run' || R.phase === 'wait' || R.phase === 'done') {
    if (R.phase === 'run' || R.phase === 'wait') {
      R.time = (performance.now() - R.started) / 1000; $('timerText').textContent = R.time.toFixed(1) + 's';
      /* run forward unless a step is in the way */
      let nx = R.x + SET.speed * dt;
      const i = ledgeUnder(R.x), nxt = LED[i + 1];
      if (nxt && nx + halfW > nxt.u0 && R.h < nxt.top - 0.002) {
        nx = Math.min(nx, nxt.u0 - halfW);
        if (R.on >= 0 && R.phase !== 'wait') { R.phase = 'wait'; R.waitT = 0; }
      } else if (R.phase === 'wait') R.phase = 'run';
      if (R.phase === 'wait') { R.waitT += dt; if (R.waitT > 0.35 && $('sayText').textContent !== 'TAP TO JUMP!') say('TAP TO JUMP!', true); }
      R.x = nx;
      if (R.x >= C.finishU && R.on === LED.length - 1) finish();
    }
    /* falling and landing */
    if (R.on < 0) {
      const prevH = R.h; R.vy -= SET.gravity * dt; R.h += R.vy * dt;
      if (R.vy < 0) {
        const i = ledgeUnder(R.x), L = LED[i];
        if (prevH >= L.top - 0.0001 && R.h <= L.top) { R.h = L.top; R.vy = 0; R.on = i; R.landT = 0; blip(220, 140, 0.08, 0.1, 'triangle');
          if (R.phase === 'drop') { R.phase = 'ready'; R.t = 0; } }
        else if (R.h < L.top) { R.h = L.top; R.vy = 0; R.on = i; R.landT = 0; }
      }
    } else if (LED[R.on] && (R.x > LED[R.on].u1 + 0.004)) { R.on = -1; }
  }
  if (R.phase === 'ready') { R.t += dt; if (R.t > 0.35 && R.t - dt <= 0.35) say('TAP TO JUMP!', true); if (R.t > 1.4) { go(); say('TAP TO JUMP!', true); setTimeout(() => { if ($('sayText').textContent === 'TAP TO JUMP!' && R.phase === 'run') say(''); }, 1400); } }
  if (R.phase === 'done') { R.t += dt; if (R.on >= 0 && R.t < 2.6 && R.anim % 0.6 < dt) { R.vy = 0.32; R.on = -1; } }
  /* squash when landing, a little stretch in the air */
  const sq = R.landT < 0.3 ? 0.18 * Math.exp(-R.landT * 12) * Math.cos(R.landT * 30) : 0;
  R.sx = 1 + sq; R.sy = 1 - sq + (R.on < 0 ? Math.min(0.08, Math.abs(R.vy) * 0.1) : 0);
  let fr;
  if (R.on < 0) fr = R.vy > 0 ? F.jump : F.fall;
  else if (R.phase === 'run') fr = F.run[Math.floor(R.anim * 18) % F.run.length];
  else fr = F.idle;
  setFrame(fr);
  if (R.on >= 0 && R.phase !== 'run') hero.scale.y *= 1 + Math.sin(R.anim * 5) * 0.015;
  hero.position.set(bx(R.x), by(R.h), 0.004);
  const L = LED[ledgeUnder(R.x)], air = Math.max(0, R.h - L.top);
  shadow.position.set(bx(R.x), by(L.top) + 0.002, 0.003);
  const s = Math.max(0.3, 1 - air * 6); shadow.scale.set(CH * 0.55 * s, CH * 0.07 * s, 1);
  /* confetti */
  for (const c of confetti) if (c.m.visible) {
    c.v.y -= 0.35 * dt; c.v.multiplyScalar(1 - 0.9 * dt);
    c.m.position.addScaledVector(c.v, dt); c.m.rotation.x += c.r.x * dt; c.m.rotation.y += c.r.y * dt; c.m.rotation.z += c.r.z * dt;
    if (c.m.position.y < -A / 2 - 0.05) c.m.visible = false;
  }
}
function finish() {
  R.phase = 'done'; R.t = 0; say('');
  const t = R.time; track('finish', { char: pick, secs: +t.toFixed(1) });
  play('fanfare', 0.75); play('cheer', 0.6, 0.3);
  const fx = bx(C.finishU), fy = by(LED[LED.length - 1].top + 0.13);
  confetti.forEach((c, i) => { c.m.visible = true; c.m.position.set(fx + (Math.random() - 0.5) * 0.04, fy, 0.02 + Math.random() * 0.02);
    const a = Math.random() * Math.PI * 2, sp = 0.18 + Math.random() * 0.28; c.v.set(Math.cos(a) * sp, Math.abs(Math.sin(a)) * sp + 0.12, (Math.random() - 0.2) * 0.25);
    c.r.set(Math.random() * 9, Math.random() * 9, Math.random() * 9); });
  setTimeout(() => {
    $('overHero').src = 'assets/chars/' + pick + '-select.webp';
    $('overTime').textContent = `${META[pick].name} reached the finish in ${t.toFixed(1)} seconds. Now take on the full game: more stages, more stars, and the rankings.`;
    $('over').classList.remove('hide'); $('timer').classList.remove('on');
  }, 1700);
}

/* ===================== tracking ===================== */
function onFound() {
  R.tracked = true; $('scan').classList.remove('on'); track('target_found');
  if (R.phase === 'idle') reset();
  else if (R.phase === 'paused') { R.phase = R.was; R.started = performance.now() - R.time * 1000; say(''); }
}
function onLost() {
  R.tracked = false; track('target_lost');
  if (R.phase === 'done' || R.phase === 'idle') return;
  if (R.phase !== 'paused') { R.was = R.phase; R.phase = 'paused'; }
  $('scan').classList.add('on'); say('');
}
let last = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - (last || t)) / 1000); last = t;
  if (F && R.phase !== 'idle' && R.phase !== 'paused') step(dt);
  requestAnimationFrame(loop);
}

/* Turning the phone: the camera picture swaps between tall and wide, so the tracker is rebuilt for the new shape */
function watchRotation() {
  const sys = scene.systems['mindar-image-system'];
  const v = sys.video; if (!v) return;
  let wide = v.videoWidth > v.videoHeight, busy = false, again = false;
  const check = async () => {
    const w = v.videoWidth, h = v.videoHeight;
    if (!w || !h || !sys.controller) return;
    if ((w > h) === wide) { try { sys._resize(); } catch (e) {} return; }
    if (busy) { again = true; return; }
    busy = true; wide = w > h;
    try {
      sys.controller.stopProcessVideo();
      await new Promise(r => setTimeout(r, 350));
      try { sys.controller.dispose(); } catch (e) {}
      v.setAttribute('width', w); v.setAttribute('height', h);
      await sys._startAR();
      track('rotated', { wide });
    } catch (e) { $('dbg').textContent = 'Turn: ' + String(e && e.message || e).slice(0, 100); }
    busy = false; if (again) { again = false; check(); }
  };
  v.addEventListener('resize', check);
  addEventListener('orientationchange', () => setTimeout(check, 400));
  addEventListener('resize', () => setTimeout(check, 250));
  setInterval(check, 1000);
}

/* ===================== screens ===================== */
function showGate() { $('gate').classList.remove('hide'); }
$('start').addEventListener('click', () => {
  audio(); F = frames(pick); T(F.idle.src);
  const begin = () => {
    try { scene.systems['mindar-image-system'].start(); $('gate').classList.add('hide'); $('scan').classList.add('on'); track('camera_start', { char: pick }); }
    catch (err) { $('warn').textContent = 'Could not start the camera: ' + (err && err.message ? err.message : err); }
  };
  if (scene.hasLoaded) begin(); else scene.addEventListener('loaded', begin, { once: true });
});
$('again').addEventListener('click', e => { e.stopPropagation(); $('over').classList.add('hide'); if (R.tracked) reset(); else { R.phase = 'idle'; $('scan').classList.add('on'); } });
$('playGame').addEventListener('click', () => track('play_full_game', { char: pick }));
$('playGame').href = SET.game + '&char=' + encodeURIComponent(pick || '');
window.addEventListener('pointerdown', e => { if (e.target.closest('.card')) return; tap(); }, { passive: true });
window.addEventListener('keydown', e => { if (e.code === 'Space') tap(); });
window.addEventListener('error', e => { if (e && e.message) $('dbg').textContent = String(e.message).slice(0, 120); });

fetch('assets/chars/chars.json?v=' + SET.version).then(r => r.json()).then(m => {
  META = m; buildPicker(); buildScene();
  $('chars').addEventListener('click', () => { $('playGame').href = SET.game + '&char=' + encodeURIComponent(pick); });
  $('playGame').href = SET.game + '&char=' + encodeURIComponent(pick);
  let ok = false; try { ok = sessionStorage.getItem('gba-ok') === '1'; } catch (e) {}
  if (SET.passcode && !ok) {
    $('lock').classList.remove('hide');
    $('codeForm').addEventListener('submit', ev => { ev.preventDefault();
      if ($('code').value.trim().toLowerCase() === SET.passcode.toLowerCase()) { try { sessionStorage.setItem('gba-ok', '1'); } catch (e) {} $('lock').classList.add('hide'); showGate(); }
      else $('codeErr').textContent = 'That is not the passcode'; });
  } else showGate();
  track('session_start');
  requestAnimationFrame(loop);
}).catch(e => { $('dbg').textContent = 'Could not load: ' + e.message; });
})();
</script>
