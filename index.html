<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Firebird AR — interactive mural</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">

<!-- Vendored so a live site has no CDN dependency. CDN equivalents if you prefer:
     https://aframe.io/releases/1.5.0/aframe.min.js
     https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js -->
<script src="./vendor/aframe.min.js"></script>
<script src="./vendor/mindar-image-aframe.prod.js"></script>

<style>
  :root{
    --ground:#f3eee4; --ink:#121e36; --accent:#f0ac2c; --ball:#d63c2c;
    --pop:#5ee83f; --panel:rgba(18,30,54,.9);
  }
  *{box-sizing:border-box}

  /* MindAR injects its <video> into <body> at z-index:-2 — the ROOT stacking
     context — so an opaque background on <body> paints straight over the
     camera. Letterbox colour lives on <html>; <body> stays transparent. */
  html{background:#000;height:100%;margin:0}
  body{margin:0;height:100%;overflow:hidden;background:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body > video{z-index:0 !important}
  a-scene{position:fixed;inset:0;z-index:1}

  /* ---------------------------------------------------------------- HUD */
  #ui{position:fixed;inset:0;z-index:10;pointer-events:none;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 20px)}

  #brand{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:16px;
    font-size:15px;font-weight:800;letter-spacing:.16em;color:#fff;
    writing-mode:vertical-rl;text-orientation:mixed;transform:rotate(180deg);
    text-shadow:0 2px 10px rgba(0,0,0,.6);opacity:.92}

  #score{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:20px;
    font-size:64px;font-weight:800;color:#fff;line-height:1;
    text-shadow:0 3px 18px rgba(0,0,0,.55);font-variant-numeric:tabular-nums;
    opacity:0;transition:opacity .25s}
  #score.on{opacity:1}
  #best{position:absolute;top:calc(env(safe-area-inset-top,0px) + 82px);right:22px;
    font-size:12px;letter-spacing:.14em;color:#fff;opacity:0;text-shadow:0 2px 8px rgba(0,0,0,.6);
    transition:opacity .25s}
  #best.on{opacity:.75}

  /* comic pop — the "HIT!" burst */
  #pop{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.4);
    font-size:76px;font-weight:900;font-style:italic;letter-spacing:-.02em;
    color:var(--pop);-webkit-text-stroke:6px #10240a;paint-order:stroke fill;
    text-shadow:0 8px 0 rgba(0,0,0,.35);opacity:0;white-space:nowrap}
  #pop.go{animation:popIn .55s cubic-bezier(.2,1.5,.4,1) forwards}
  @keyframes popIn{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}
    35%{opacity:1;transform:translate(-50%,-56%) scale(1.12) rotate(3deg)}
    70%{opacity:1;transform:translate(-50%,-58%) scale(1) rotate(-1deg)}
    100%{opacity:0;transform:translate(-50%,-72%) scale(1) rotate(0)}
  }

  /* big encouragement line, e.g. KEEP IT UP! */
  #cheer{position:absolute;left:50%;top:22%;transform:translate(-50%,0);
    font-size:34px;font-weight:900;font-style:italic;color:var(--pop);
    -webkit-text-stroke:4px #10240a;paint-order:stroke fill;white-space:nowrap;
    opacity:0;transition:opacity .3s}
  #cheer.on{opacity:1}

  #countdown{position:absolute;inset:0;display:grid;place-items:center;
    font-size:190px;font-weight:800;color:#fff;text-shadow:0 6px 30px rgba(0,0,0,.5);
    opacity:0;pointer-events:none}
  #countdown.go{animation:cd .9s ease-out forwards}
  @keyframes cd{0%{opacity:0;transform:scale(1.6)}25%{opacity:1;transform:scale(1)}
                80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}

  #tapplay{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);
    font-size:30px;font-weight:900;font-style:italic;color:var(--pop);
    -webkit-text-stroke:4px #10240a;paint-order:stroke fill;
    opacity:0;transition:opacity .3s;white-space:nowrap}
  #tapplay.on{opacity:1;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-8px)}}

  /* scanning reticle */
  #scan{position:fixed;inset:0;z-index:9;display:none;place-items:center;pointer-events:none}
  #scan.on{display:grid}
  #scan .box{width:min(76vw,330px);aspect-ratio:7/4;position:relative;animation:breathe 2.4s ease-in-out infinite}
  #scan .box i{position:absolute;width:32px;height:32px;border:3px solid #fff;opacity:.9}
  #scan .box i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}
  #scan .box i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
  #scan .box i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}
  #scan .box i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
  #scanTxt{position:absolute;bottom:22%;left:50%;transform:translateX(-50%);
    color:#fff;font-size:15px;text-shadow:0 2px 12px rgba(0,0,0,.7);text-align:center;white-space:nowrap}
  @keyframes breathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.04);opacity:1}}

  /* ------------------------------------------------------------- cards */
  .card{position:fixed;inset:0;z-index:30;background:var(--ground);color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;gap:18px}
  .card.hide{display:none}
  .card h1{font-size:34px;line-height:1.05;margin:0;letter-spacing:-.02em}
  .card h1 em{font-style:normal;color:var(--ball)}
  .card p{margin:0;max-width:34ch;font-size:15px;line-height:1.5;color:#55617a}
  .card button,.card a.btn{pointer-events:auto;border:0;border-radius:999px;background:var(--ink);
    color:#fff;font-size:17px;font-weight:700;padding:16px 40px;letter-spacing:.02em;
    text-decoration:none;display:inline-block}
  .card button:active{transform:scale(.97)}
  .card small{font-size:11px;letter-spacing:.12em;color:#8a93a8}
  #warn{background:#fdf0ee;border:1px solid #f0c8c0;color:#a3271a;border-radius:12px;
    padding:12px 16px;font-size:13px;line-height:1.45;max-width:34ch;display:none}
  #warn.on{display:block}
  #code{pointer-events:auto;border:2px solid #c9cfda;border-radius:14px;padding:14px 20px;
    font-size:18px;text-align:center;width:min(260px,72vw);background:#fff;color:var(--ink)}
  #code:focus{outline:none;border-color:var(--ink)}

  /* end card, modelled on the reference's score screen */
  #over{background:var(--ink);color:#fff}
  #over h1{font-size:38px;font-style:italic;color:var(--pop);
    -webkit-text-stroke:3px #10240a;paint-order:stroke fill}
  #over .num{font-size:104px;font-weight:800;line-height:.9;color:var(--accent);
    font-variant-numeric:tabular-nums}
  #over .lbl{font-size:13px;letter-spacing:.3em;opacity:.7}
  #over p{color:#c3cbdb}
  #over .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  #over .ghost{background:transparent;border:2px solid rgba(255,255,255,.45)}
  #newbest{font-size:13px;letter-spacing:.2em;color:var(--accent);font-weight:700;visibility:hidden}
  #misses{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:50%;
    transform:translateX(-50%);display:none;gap:9px;align-items:center}
  #misses.on{display:flex}
  #misses i{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.75);
    box-shadow:0 2px 8px rgba(0,0,0,.5)}
  #misses i.spent{background:var(--ball);border-color:var(--ball)}
</style>
</head>
<body>

<div id="lock" class="card hide">
  <small>PRIVATE PROTOTYPE</small>
  <h1 id="lockTitle">Work in progress</h1>
  <p id="lockBody"></p>
  <input id="code" type="text" autocomplete="off" autocapitalize="none" spellcheck="false"
         placeholder="Passcode" aria-label="Passcode">
  <button id="unlock">Continue</button>
  <small id="codeErr" style="color:#a3271a;visibility:hidden">That is not the passcode</small>
</div>

<div id="gate" class="card hide">
  <small id="kicker">FIREBIRD AFRICA · AR SITE</small>
  <h1 id="title">Loading…</h1>
  <p id="intro"></p>
  <div id="warn"></div>
  <button id="start">Start camera</button>
  <small id="build" style="opacity:.5"></small>
  <small id="dbg" style="opacity:.55"></small>
</div>

<div id="over" class="card hide">
  <h1 id="overTitle">Keep It Up!</h1>
  <div class="lbl" id="overLbl">SCORE</div>
  <div class="num" id="finalScore">0</div>
  <div id="newbest">NEW PERSONAL BEST</div>
  <p id="overBody"></p>
  <div class="row">
    <button id="again">Play again</button>
    <button id="share" class="ghost">Share your score</button>
  </div>
  <a id="overCta" class="btn" href="#" target="_blank" rel="noopener" style="background:var(--accent);color:var(--ink)"></a>
</div>

<div id="scan"><div class="box"><i></i><i></i><i></i><i></i></div><div id="scanTxt">Point at the mural</div></div>

<div id="ui">
  <div id="brand">FIREBIRD</div>
  <div id="score">0</div>
  <div id="best"></div>
  <div id="pop"></div>
  <div id="cheer"></div>
  <div id="tapplay">Tap To Play</div>
  <div id="misses"></div>
  <div id="countdown"></div>
</div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const track = window.FIREBIRD_TRACK || function (e, d) { console.log('[track]', e, d || {}); };

  // Which campaign loads: ?c=name wins, otherwise site.json's defaultCampaign.
  // Keeping the default in site.json means switching which experience the plain
  // link shows is a one-word edit, not a code change.
  const params = new URLSearchParams(location.search);
  let campaignId = (params.get('c') || '').replace(/[^a-z0-9_-]/gi, '');

  const ua = navigator.userAgent || '';
  const inApp = /FBAN|FBAV|Instagram|Line\/|Twitter|WhatsApp|MicroMessenger/i.test(ua);
  const secure = location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname);
  const warn = $('warn');
  if (!secure) {
    warn.classList.add('on');
    warn.textContent = 'This page must be served over HTTPS for the camera to work. Open the hosted https:// link, not a local file.';
  } else if (inApp) {
    warn.classList.add('on');
    warn.textContent = 'You opened this inside another app’s browser, which usually blocks the camera. Tap the ⋯ menu and choose “Open in Safari” or “Open in Chrome”.';
  }

  let C, scene, targetEl, ballEl, shadowEl, glowEl;
  // Every asset is fetched with ?v=<build>. Without this the phone happily
  // keeps serving yesterday's ball and yesterday's game from its cache, and
  // you spend an evening wondering why an upload did nothing.
  let BUILD = '0';

  /* ------------------------------------------------------------ access gate
     A doorman, not a vault: it makes a forwarded link useless, but the code
     lives in the page. Real locking belongs on the host. */
  function gateAccess() {
    return fetch('site.json').then((r) => (r.ok ? r.json() : {})).catch(() => ({}))
      .then((s) => new Promise((resolve) => {
        const code = (s.passcode || '').trim();
        let already = false;
        try { already = sessionStorage.getItem('fb_unlocked') === code && code !== ''; } catch (e) {}
        if (!campaignId) campaignId = (s.defaultCampaign || 'fridge').replace(/[^a-z0-9_-]/gi, '');
        BUILD = String(s.build || '0');
        $('build').textContent = 'build ' + BUILD;
        if (!code || already) { $('gate').classList.remove('hide'); return resolve(); }
        $('lockTitle').textContent = s.lockTitle || 'Work in progress';
        $('lockBody').textContent = s.lockBody || 'This is an internal prototype, not a public site.';
        $('lock').classList.remove('hide');
        const attempt = () => {
          if ($('code').value.trim().toLowerCase() === code.toLowerCase()) {
            try { sessionStorage.setItem('fb_unlocked', code); } catch (e) {}
            $('lock').classList.add('hide');
            $('gate').classList.remove('hide');
            resolve();
          } else { $('codeErr').style.visibility = 'visible'; $('code').value = ''; }
        };
        $('unlock').addEventListener('click', attempt);
        $('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') attempt(); });
      }));
  }

  gateAccess().then(() => fetch('campaigns/' + campaignId + '.json?v=' + BUILD)
    .then((r) => { if (!r.ok) throw new Error('campaign ' + campaignId + ' not found'); return r.json(); })
    .then(boot)
    .catch((e) => {
      $('title').textContent = 'Campaign not found';
      $('intro').textContent = e.message;
      $('start').style.display = 'none';
    }));

  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function boot(cfg) {
    C = cfg;
    track('session_start', { campaign: C.id });
    const p = C.palette || {}, root = document.documentElement.style;
    ['ground', 'ink', 'accent', 'ball', 'pop'].forEach((k) => { if (p[k]) root.setProperty('--' + k, p[k]); });
    $('kicker').textContent = C.kicker || '';
    $('brand').textContent = C.brand || '';
    $('title').innerHTML = esc(C.copy.title) + '<br><em>' + esc(C.copy.titleAccent || '') + '</em>';
    $('intro').textContent = C.copy.intro || '';
    $('tapplay').textContent = C.copy.tapToPlay || 'Tap To Play';
    $('overTitle').textContent = C.copy.overTitle || 'Keep It Up!';
    $('scanTxt').textContent = C.copy.scanning || 'Point at the mural';
    document.title = C.brand + ' — AR';
    try { G.best = Number(localStorage.getItem('fb_best_' + campaignId) || 0) || 0; } catch (e) {}
    buildScene();
  }

  /* --------------------------------------------------------------- scene */
  function buildScene() {
    const props = (C.props || []).map((pr) => {
      const pos = pr.pos.join(' ');
      const mat = 'material="color:' + pr.color + '; roughness:.55"';
      if (pr.type === 'sphere') return `<a-sphere class="prop" position="${pos}" radius="${pr.size[0]}" ${mat}></a-sphere>`;
      if (pr.type === 'cylinder') return `<a-cylinder class="prop" position="${pos}" radius="${pr.size[0]}" height="${pr.size[1]}" ${mat}></a-cylinder>`;
      if (pr.type === 'disc') return `<a-cylinder class="prop" position="${pos}" radius="${pr.size[0]}" height="${pr.size[1]}" rotation="90 0 0" ${mat}></a-cylinder>`;
      return `<a-box class="prop" position="${pos}" width="${pr.size[0]}" height="${pr.size[1]}" depth="${pr.size[2]}" ${mat}></a-box>`;
    }).join('');

    const ballMat = C.ball && C.ball.texture
      ? `material="src: ${C.ball.texture}?v=${BUILD}; roughness:.45; metalness:0"`
      : `material="color:${C.palette.ball || '#d63c2c'}; roughness:.4"`;

    document.body.insertAdjacentHTML('beforeend',
      `<a-scene mindar-image="imageTargetSrc: ${C.target}?v=${BUILD}; autoStart: false; uiScanning: no; uiLoading: no; uiError: no;
         filterMinCF: 0.0001; filterBeta: 0.005; missTolerance: 6; warmupTolerance: 3"
        color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights: true"
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        <a-assets>${C.ball && C.ball.texture ? `<img id="balltex" src="${C.ball.texture}?v=${BUILD}" crossorigin="anonymous">` : ''}</a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="target" mindar-image-target="targetIndex: 0">
          <a-entity light="type: ambient; intensity: 0.9"></a-entity>
          <a-entity light="type: directional; intensity: 0.55" position="0.4 0.7 1"></a-entity>
          <a-plane id="glow" position="0 0 -0.002" width="1.02" height="0.60"
            material="color: ${C.palette.accent || '#f0ac2c'}; opacity: 0; transparent: true; side: double"></a-plane>
          <a-entity id="props">${props}</a-entity>
          <a-ring id="shadow" position="0 -0.5 0.002" radius-inner="0" radius-outer="0.07"
            material="color:#000; opacity:.2; transparent:true; side:double"></a-ring>
          <a-sphere id="ball" radius="${(C.ball && C.ball.radius) || 0.13}"
            position="0 0.3 0.2" segments-width="32" segments-height="24" ${ballMat}></a-sphere>
        </a-entity>
      </a-scene>`);

    scene = document.querySelector('a-scene');
    targetEl = $('target'); ballEl = $('ball'); shadowEl = $('shadow'); glowEl = $('glow');
    targetEl.addEventListener('targetFound', onFound);
    targetEl.addEventListener('targetLost', onLost);
    ballEl.object3D.visible = false;
  }

  /* ---------------------------------------------------------------- game
     Keepy-uppy, as in the reference: the ball falls under gravity and you tap
     it to send it back up. Miss it and the run ends. Everything happens in the
     mural's own coordinate space, so the ball really is in front of the wall. */
  const G = { phase: 'idle', score: 0, best: 0, last: 0, tracked: false,
              pos: {x: 0, y: 0.3, z: 0.2}, vel: {x: 0, y: 0, z: 0}, spin: {x: 0, y: 0} };

  const V3 = () => new AFRAME.THREE.Vector3();

  function resetBall() {
    const ph = C.play;
    G.pos = { x: 0, y: ph.startY, z: ph.startZ };
    G.vel = { x: 0, y: 0, z: 0 };
    G.spin = { x: 0, y: 0 };
    applyBall();
  }

  function applyBall() {
    if (!ballEl) return;
    ballEl.object3D.position.set(G.pos.x, G.pos.y, G.pos.z);
    ballEl.object3D.rotation.x = G.spin.x;
    ballEl.object3D.rotation.y = G.spin.y;
    // Contact shadow on the wall. Only drawn while the ball is actually over
    // the artwork — off the edge there is no wall to cast onto, and a grey
    // disc floating in the sky is the fastest way to break the illusion.
    const overWall = Math.abs(G.pos.x) < 0.48 && Math.abs(G.pos.y) < 0.27;
    shadowEl.object3D.visible = overWall && ballEl.object3D.visible;
    if (overWall) {
      shadowEl.object3D.position.set(G.pos.x, G.pos.y, 0.003);
      const near = Math.min(1, Math.max(0, G.pos.z / 0.6));
      const s = 0.8 + near * 0.5;
      shadowEl.object3D.scale.set(s, s, s);
      shadowEl.setAttribute('material', 'opacity', 0.16 * (1 - near * 0.8));
    }
  }

  function pop(text) {
    const el = $('pop');
    el.textContent = text;
    el.classList.remove('go');
    void el.offsetWidth;
    el.classList.add('go');
  }

  function cheer(text) {
    const el = $('cheer');
    el.textContent = text;
    el.classList.add('on');
    clearTimeout(cheer._t);
    cheer._t = setTimeout(() => el.classList.remove('on'), 1800);
  }

  function setScore(n) {
    G.score = n;
    $('score').textContent = n;
    const cues = C.copy.cheers || {};
    if (cues[n]) cheer(cues[n]);
  }

  /* Hit testing: project the ball to screen space and compare with the tap.
     Cheaper and far more forgiving than a raycast, which matters when someone
     is holding a phone at arm's length in the sun. */
  function ballScreen() {
    const cam = scene.camera;
    const v = V3();
    ballEl.object3D.getWorldPosition(v);
    const world = v.clone();
    v.project(cam);
    const x = (v.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-v.y * 0.5 + 0.5) * window.innerHeight;
    // radius in pixels: project a point one radius to the side
    const camPos = V3();
    cam.getWorldPosition(camPos);
    const dist = camPos.distanceTo(world);
    const r = (C.ball.radius / Math.max(0.15, dist)) * (window.innerHeight / (2 * Math.tan(
      (cam.fov || 60) * Math.PI / 360)));
    return { x, y, r, behind: v.z > 1 };
  }

  /* ============================================================== DRAW MODE
     "picker": the wall draws numbers for you. Tap, the ball flies into the
     drum painted on the mural, a numbered ball rolls out of the chute and
     drops into the next empty slot. Six taps, six numbers, and the player
     walks away with something they keep — which is what the rally never gave
     them. Positions come from the campaign file so they match the artwork. */
  const DRAW = { picked: [], ball: null, discs: [], lost: 0, speed: 1, paused: false };

  function rand(max) {
    if (window.crypto && crypto.getRandomValues) {
      const a = new Uint32Array(1);
      const limit = Math.floor(0xffffffff / max) * max;
      do { crypto.getRandomValues(a); } while (a[0] >= limit);
      return (a[0] % max) + 1;
    }
    return Math.floor(Math.random() * max) + 1;
  }

  function drawNumber() {
    const max = C.draw.maxNumber;
    let n;
    do { n = rand(max); } while (DRAW.picked.includes(n));
    return n;
  }

  // Numbered disc, drawn to a canvas so there are no font files to ship.
  function makeDisc(n) {
    const S = 256, cv = document.createElement('canvas');
    cv.width = cv.height = S;
    const g = cv.getContext('2d');
    g.clearRect(0, 0, S, S);
    g.fillStyle = C.draw.discFill || '#f7f2e8';
    g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 8, 0, 6.284); g.fill();
    g.lineWidth = 12; g.strokeStyle = C.draw.discRing || '#e8b230'; g.stroke();
    const grad = g.createRadialGradient(S * 0.36, S * 0.3, 8, S * 0.5, S * 0.5, S * 0.6);
    grad.addColorStop(0, 'rgba(255,255,255,.85)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad; g.beginPath(); g.arc(S / 2, S / 2, S / 2 - 14, 0, 6.284); g.fill();
    g.fillStyle = C.draw.discInk || '#26143a';
    g.font = 'bold ' + (n > 9 ? 112 : 128) + 'px -apple-system, Helvetica, Arial, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(String(n), S / 2, S / 2 + 6);
    const THREE = AFRAME.THREE;
    const tex = new THREE.CanvasTexture(cv);
    tex.colorSpace = THREE.SRGBColorSpace || tex.colorSpace;
    const mesh = new THREE.Mesh(
      new THREE.CircleGeometry(C.draw.discRadius, 40),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true })
    );
    targetEl.object3D.add(mesh);
    return mesh;
  }

  function say(text) {
    const el = $('cheer');
    el.textContent = text; el.classList.add('on');
    clearTimeout(say._t); say._t = setTimeout(() => el.classList.remove('on'), 1300);
  }

  /* ---------------------------------------------------------- ramp round
     A ball rolls down the slide painted on the wall and falls off the end.
     Catch it before it drops and its number is yours; let it go and the
     number is lost and you wait for the next one. Each ball rolls a little
     faster, so the pressure builds across the six. */
  function spawnBall(delay) {
    DRAW.ball = { stage: 'wait', t: 0, wait: delay == null ? 0.5 : delay,
                  n: drawNumber(), vy: 0, x: 0, y: 0 };
    ballEl.object3D.visible = false;
  }

  function rampPoint(t) {
    const a = C.draw.rampStart, b = C.draw.rampEnd;
    return { x: a[0] + (b[0] - a[0]) * t, y: a[1] + (b[1] - a[1]) * t };
  }

  function stepDraw(dt) {
    const b = DRAW.ball, cfg = C.draw;
    if (!b) return;

    if (b.stage === 'wait') {
      b.wait -= dt;
      if (b.wait <= 0) {
        b.stage = 'roll'; b.t = 0;
        ballEl.object3D.visible = true;
        say(C.copy.incoming || 'HERE IT COMES');
      }
      return;
    }

    if (b.stage === 'roll') {
      // gentle acceleration down the slide, and faster with every ball drawn
      const base = cfg.rollSecs / DRAW.speed;
      b.t += (dt / base) * (0.75 + b.t * 0.5);
      const p = rampPoint(Math.min(1, b.t));
      b.x = p.x; b.y = p.y;
      G.pos.x = p.x; G.pos.y = p.y; G.pos.z = cfg.rollZ;
      G.spin.y += dt * 7; G.spin.x -= dt * 5;
      applyBall();
      if (b.t >= 1) { b.stage = 'fall'; b.vy = -0.05; }
      return;
    }

    if (b.stage === 'fall') {
      b.vy -= cfg.fallGravity * dt;
      b.y += b.vy * dt;
      b.x += cfg.fallDrift * dt;
      G.pos.x = b.x; G.pos.y = b.y; G.pos.z = cfg.rollZ;
      G.spin.x -= dt * 9;
      applyBall();
      if (b.y < cfg.missY) {
        DRAW.lost += 1;
        pop(C.copy.miss || 'MISSED!');
        renderMisses();
        track('number_missed', { campaign: C.id, lost: DRAW.lost });
        ballEl.object3D.visible = false;
        const max = cfg.maxMisses || 3;
        if (DRAW.lost >= max) {
          say(C.copy.outOfBalls || 'OUT OF BALLS');
          DRAW.ball = null;
          setTimeout(finishDraw, 900);
          return;
        }
        say(C.copy.missHint || 'that number is gone');
        spawnBall(cfg.gapSecs);
      }
      return;
    }

    if (b.stage === 'toSlot') {
      b.t += dt / cfg.toSlotSecs;
      const e = Math.min(1, b.t), ee = e * e * (3 - 2 * e);
      b.mesh.position.set(
        b.fromX + (b.slot[0] - b.fromX) * ee,
        b.fromY + (b.slot[1] - b.fromY) * ee - Math.sin(Math.PI * ee) * 0.05,
        0.06 - ee * 0.05
      );
      const sc = 1.3 - 0.3 * ee;
      b.mesh.scale.set(sc, sc, sc);
      if (e >= 1) {
        DRAW.discs.push(b.mesh);
        if (DRAW.picked.length >= cfg.count) { DRAW.ball = null; return finishDraw(); }
        DRAW.speed = Math.min(cfg.maxSpeed || 2.2, DRAW.speed + (cfg.speedStep || 0.16));
        spawnBall(cfg.gapSecs);
      }
    }
  }

  function renderMisses() {
    const max = (C.draw.maxMisses || 3);
    const el = $('misses');
    el.classList.add('on');
    el.innerHTML = '';
    for (let i = 0; i < max; i++) {
      const dot = document.createElement('i');
      if (i < DRAW.lost) dot.className = 'spent';
      el.appendChild(dot);
    }
  }

  function catchBall() {
    const b = DRAW.ball, cfg = C.draw;
    if (!b || (b.stage !== 'roll' && b.stage !== 'fall')) return false;
    const s = ballScreen();
    if (s.behind) return false;
    const dx = lastTap.x - s.x, dy = lastTap.y - s.y;
    const forgive = Math.max(52, s.r * (cfg.tapForgiveness || 1.8));
    if (dx * dx + dy * dy > forgive * forgive) return false;

    DRAW.picked.push(b.n);
    $('score').textContent = DRAW.picked.length;
    pop(String(b.n));
    say(C.copy.caught || 'CAUGHT IT');
    track('number_caught', { campaign: C.id, n: b.n, index: DRAW.picked.length });
    glowEl.setAttribute('material', 'opacity', 0.24);
    setTimeout(() => glowEl.setAttribute('material', 'opacity', 0), 240);
    ballEl.object3D.visible = false;
    b.mesh = makeDisc(b.n);
    b.mesh.position.set(G.pos.x, G.pos.y, 0.06);
    b.fromX = G.pos.x; b.fromY = G.pos.y;
    b.slot = cfg.slots[DRAW.picked.length - 1];
    b.stage = 'toSlot'; b.t = 0;
    return true;
  }

  function finishDraw() {
    G.phase = 'over';
    ballEl.object3D.visible = false;
    $('score').classList.remove('on');
    $('best').classList.remove('on');
    const sorted = DRAW.picked.slice().sort((a, b) => a - b);
    $('overTitle').textContent = C.copy.overTitle || 'Your numbers';
    $('overLbl').textContent = C.copy.overLabel || 'FOR THE NEXT DRAW';
    $('share').textContent = C.copy.shareButton || 'Share your numbers';
    $('finalScore').textContent = sorted.length ? sorted.join('  ') : '—';
    $('misses').classList.remove('on');
    $('finalScore').style.fontSize = 'clamp(28px, 9vw, 46px)';
    $('newbest').style.visibility = 'hidden';
    const ranOut = DRAW.lost >= (C.draw.maxMisses || 3) && DRAW.picked.length < C.draw.count;
    const missNote = ranOut
      ? ` You dropped ${DRAW.lost} and ran out before the set was full.`
      : DRAW.lost
        ? ` You let ${DRAW.lost} ball${DRAW.lost > 1 ? 's' : ''} drop.`
        : ' Not a single one dropped.';
    $('overBody').textContent = ((C.reward && C.reward.body) || '') + missNote;
    const cta = $('overCta');
    if (C.reward && C.reward.url) {
      cta.textContent = C.reward.cta || 'Continue';
      cta.href = C.reward.url;
      cta.style.display = '';
    } else { cta.style.display = 'none'; }
    $('over').classList.remove('hide');
    track('draw_complete', { campaign: C.id, numbers: sorted, lost: DRAW.lost });
  }

  function resetDraw() {
    DRAW.discs.forEach((m) => targetEl.object3D.remove(m));
    DRAW.discs = [];
    DRAW.picked = [];
    DRAW.ball = null;
    DRAW.lost = 0;
    DRAW.speed = 1;
    DRAW.paused = false;
    $('finalScore').style.fontSize = '';
    $('score').textContent = '0';
    $('misses').classList.remove('on');
  }

  const lastTap = { x: 0, y: 0 };

  /* Agitator balls inside the drum painted on the wall. They tumble whenever
     the wall is in view, so the mural looks alive before anyone taps, and the
     ball that rolls out has somewhere to have come from. */
  const AGIT = [];
  function buildAgitator() {
    const cfg = C.draw, THREE = AFRAME.THREE;
    if (!cfg.drum || AGIT.length) return;
    const n = cfg.drumBalls || 6;
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(cfg.drumBallRadius || 0.022, 18, 14),
        new THREE.MeshStandardMaterial({ color: 0xf6f1e4, roughness: 0.5 })
      );
      m.userData.a = (i / n) * Math.PI * 2;
      m.userData.r = (cfg.drumRadius || 0.075) * (0.35 + 0.6 * ((i * 7 % 5) / 5));
      m.userData.sp = 0.7 + (i % 3) * 0.35;
      targetEl.object3D.add(m);
      AGIT.push(m);
    }
  }
  function stepAgitator(now) {
    if (!AGIT.length) return;
    const c = C.draw.drum;
    for (const m of AGIT) {
      const u = m.userData;
      u.a += 0.016 * u.sp;
      m.position.set(c[0] + Math.cos(u.a) * u.r,
                     c[1] + Math.sin(u.a * 1.3) * u.r * 0.8,
                     0.03 + Math.sin(u.a * 0.7) * 0.012);
      m.rotation.y = u.a * 2;
    }
  }

  function onTap(ev) {
    if (ev.target.closest && ev.target.closest('.card')) return;

    if (C.mode === 'picker') {
      if (!G.tracked) return;
      const t = (ev.touches && ev.touches[0]) || ev;
      lastTap.x = t.clientX; lastTap.y = t.clientY;
      if (G.phase === 'ready' || G.phase === 'idle') {
        G.phase = 'draw';
        $('score').classList.add('on');
        $('tapplay').classList.remove('on');
        DRAW.speed = 1;
        renderMisses();
        spawnBall(0.6);
        return;
      }
      if (G.phase === 'draw') catchBall();
      return;
    }

    if (G.phase === 'ready') return startRound();
    if (G.phase !== 'play') return;

    const t = (ev.touches && ev.touches[0]) || ev;
    const s = ballScreen();
    if (s.behind) return;
    const dx = t.clientX - s.x, dy = t.clientY - s.y;
    const forgiveness = Math.max(46, s.r * (C.play.tapForgiveness || 1.5));
    if (dx * dx + dy * dy > forgiveness * forgiveness) return;   // swing and a miss

    const ph = C.play;
    G.vel.y = ph.hitImpulse;
    // where you hit it decides where it goes — off-centre taps send it sideways
    G.vel.x = Math.max(-ph.maxSide, Math.min(ph.maxSide, -dx / forgiveness * ph.sideGain + G.vel.x * 0.2));
    G.vel.z = Math.max(-0.25, Math.min(ph.maxDepth, G.vel.z * 0.3 + (Math.random() - 0.35) * ph.depthGain));
    G.spin.y += 0.9; G.spin.x -= 0.6;

    setScore(G.score + 1);
    pop(C.copy.hit || 'HIT!');
    track('rally_score', { campaign: C.id, score: G.score });
    popProps();
  }

  function popProps() {
    document.querySelectorAll('.prop').forEach((p, i) => {
      const o = p.object3D;
      if (o.userData.baseZ === undefined) o.userData.baseZ = o.position.z;
      o.position.z = o.userData.baseZ + 0.06;
      setTimeout(() => { o.position.z = o.userData.baseZ; }, 200 + i * 40);
    });
  }

  function startRound() {
    G.phase = 'count';
    $('tapplay').classList.remove('on');
    setScore(0);
    resetBall();
    ballEl.object3D.visible = false;
    const steps = ['3', '2', '1'];
    let i = 0;
    const cd = $('countdown');
    const tick = () => {
      if (!G.tracked) { G.phase = 'ready'; cd.classList.remove('go'); return; }
      if (i >= steps.length) {
        cd.classList.remove('go');
        cd.textContent = '';
        G.phase = 'play';
        ballEl.object3D.visible = true;
        $('score').classList.add('on');
        $('best').classList.add('on');
        $('best').textContent = 'BEST ' + G.best;
        cheer(C.copy.go || 'GO!');
        return;
      }
      cd.textContent = steps[i++];
      cd.classList.remove('go'); void cd.offsetWidth; cd.classList.add('go');
      setTimeout(tick, 750);
    };
    tick();
  }

  function endRound() {
    G.phase = 'over';
    ballEl.object3D.visible = false;
    $('score').classList.remove('on');
    $('best').classList.remove('on');
    const isBest = G.score > G.best;
    if (isBest) {
      G.best = G.score;
      try { localStorage.setItem('fb_best_' + campaignId, String(G.best)); } catch (e) {}
    }
    $('finalScore').textContent = G.score;
    $('newbest').style.visibility = isBest && G.score > 0 ? 'visible' : 'hidden';
    const r = C.reward || {};
    $('overBody').textContent = G.score >= (C.play.goal || 8)
      ? (r.body || '') : (C.copy.tryAgain || 'Keep it up — the mural is waiting.');
    const cta = $('overCta');
    if (G.score >= (C.play.goal || 8) && r.url) {
      cta.textContent = r.cta || 'Continue';
      cta.href = r.url;
      cta.style.display = '';
    } else {
      cta.style.display = 'none';
    }
    $('over').classList.remove('hide');
    track('round_end', { campaign: C.id, score: G.score, best: G.best });
    if (G.score >= (C.play.goal || 8)) track('goal_reached', { campaign: C.id, score: G.score });
  }

  $('again').addEventListener('click', () => {
    $('over').classList.add('hide');
    if (C.mode === 'picker') {
      resetDraw();
      G.phase = 'ready';
      ballEl.object3D.visible = false;
      $('tapplay').textContent = C.copy.tapToPlay || 'Tap To Start';
      $('tapplay').classList.add('on');
      return;
    }
    if (G.tracked) startRound(); else { G.phase = 'ready'; $('tapplay').classList.add('on'); }
  });

  $('share').addEventListener('click', async () => {
    const text = C.mode === 'picker'
      ? `${C.copy.shareText || 'The wall picked my numbers:'} ${DRAW.picked.slice().sort((a,b)=>a-b).join(', ')} — ${C.brand}.`
      : `${C.copy.shareText || 'I scored'} ${G.score} on the ${C.brand} AR mural.`;
    track('share_click', { campaign: C.id, score: G.score });
    try {
      if (navigator.share) await navigator.share({ title: C.brand, text, url: location.href });
      else { await navigator.clipboard.writeText(text + ' ' + location.href); $('share').textContent = 'Copied!'; }
    } catch (e) { /* user dismissed */ }
  });

  $('overCta').addEventListener('click', () => track('cta_click', { campaign: C.id }));

  /* ---------------------------------------------------------------- loop */
  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.04, (now - (G.last || now)) / 1000);
    G.last = now;

    if (C.mode === 'picker') {
      // Only advance the draw while the wall is in view. Otherwise a ball
      // keeps rolling — and can be "missed" — while the phone is pointed at
      // the pavement, which is not the player's fault.
      if (G.tracked) stepAgitator(now);
      if (G.tracked && G.phase === 'draw' && !DRAW.paused) stepDraw(dt);
    } else if (G.phase === 'play') {
      const ph = C.play;
      G.vel.y -= ph.gravity * dt;
      G.pos.x += G.vel.x * dt;
      G.pos.y += G.vel.y * dt;
      G.pos.z += G.vel.z * dt;

      // keep it roughly in front of the wall
      if (G.pos.x < -ph.boundX) { G.pos.x = -ph.boundX; G.vel.x *= -0.7; }
      if (G.pos.x > ph.boundX) { G.pos.x = ph.boundX; G.vel.x *= -0.7; }
      if (G.pos.z < ph.minZ) { G.pos.z = ph.minZ; G.vel.z *= -0.6; }
      if (G.pos.z > ph.maxZ) { G.pos.z = ph.maxZ; G.vel.z *= -0.6; }

      G.spin.x += G.vel.y * dt * 2.5;
      G.spin.y += G.vel.x * dt * 3.5;
      applyBall();

      if (G.pos.y < ph.floorY) { pop(C.copy.miss || 'MISSED!'); endRound(); }
    }

    const b = now / 620;
    document.querySelectorAll('.prop').forEach((p, i) => {
      const o = p.object3D;
      if (o.userData.baseY === undefined) o.userData.baseY = o.position.y;
      o.position.y = o.userData.baseY + Math.sin(b + i * 1.3) * 0.012;
      o.rotation.y = Math.sin(b * 0.6 + i) * 0.4;
    });
  }

  /* -------------------------------------------------------------- tracking */
  function onFound() {
    G.tracked = true;
    $('scan').classList.remove('on');
    glowEl.setAttribute('material', 'opacity', 0.3);
    setTimeout(() => glowEl.setAttribute('material', 'opacity', 0), 500);
    popProps();
    track('target_found', { campaign: C.id });
    if (C.mode === 'picker' && DRAW.paused) {
      DRAW.paused = false;
      say(C.copy.resumed || 'BACK ON');
      spawnBall(C.draw.gapSecs || 0.9);
      return;
    }
    if (G.phase === 'idle' || G.phase === 'lost') {
      G.phase = 'ready';
      if (C.mode === 'picker') {
        buildAgitator();
        ballEl.object3D.visible = false;
        $('tapplay').textContent = C.copy.tapToPlay || 'Tap To Start';
      }
      $('tapplay').classList.add('on');
    }
  }

  function onLost() {
    G.tracked = false;
    track('target_lost', { campaign: C.id });
    if (G.phase === 'over') return;
    if (C.mode === 'picker' && G.phase === 'draw') {
      DRAW.paused = true;
      // a number caught in the last instant would otherwise be stranded
      // mid-flight; snap it home so the slot is filled when you look back
      const b = DRAW.ball;
      if (b && b.stage === 'toSlot' && b.mesh) {
        b.mesh.position.set(b.slot[0], b.slot[1], 0.01);
        b.mesh.scale.set(1, 1, 1);
        DRAW.discs.push(b.mesh);
        DRAW.ball = null;
      }
      if (ballEl) ballEl.object3D.visible = false;
      $('scan').classList.add('on');
      $('tapplay').classList.remove('on');
      return;                       // keep phase, picked numbers and discs
    }
    G.phase = 'lost';
    $('scan').classList.add('on');
    $('tapplay').classList.remove('on');
    $('score').classList.remove('on');
    $('best').classList.remove('on');
    if (ballEl) ballEl.object3D.visible = false;
  }

  window.addEventListener('pointerdown', onTap, { passive: true });

  $('start').addEventListener('click', () => {
    const begin = () => {
      try {
        scene.systems['mindar-image-system'].start();
        $('gate').classList.add('hide');
        $('scan').classList.add('on');
        resetBall();
        requestAnimationFrame(loop);
        track('camera_start', { campaign: C.id });
      } catch (err) {
        warn.classList.add('on');
        warn.textContent = 'Could not start the camera: ' + (err && err.message ? err.message : err);
      }
    };
    if (scene && scene.hasLoaded) begin();
    else if (scene) scene.addEventListener('loaded', begin, { once: true });
  });

  window.addEventListener('error', (e) => { if (e && e.message) $('dbg').textContent = String(e.message).slice(0, 120); });

  // test hook
  window.FIREBIRD_DEBUG = { G, DRAW, ballScreen: () => ballScreen(), startRound, config: () => C };
})();
</script>
</body>
</html>
